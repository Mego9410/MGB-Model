# Interior and trim, 1962-67 roadster. Haynes Ch 12 Sec 3 (upholstery and carpets), Sec 29 (early Sports Tourer door trim
# pad), Sec 47 and Fig 12.19 (printed p233: the early facia, its fixing plates, glovebox and lid, crash roll), Sec 54
# (seats), Ch 6 Fig 6.3 items 161-166 (gear lever grommet and retainer) and Sec 2 para 1 (rubber cover over the gearbox
# dipstick). The facia is built round P10's instrument and switch datums (mgb/body_layout.py). Forms derived from the
# figures and the cover cutaway; trim in black vinyl with red seat piping, carpets black (Oliver's photos 01, 04, 16, 17, 22).
defaults:
  system: body
  assembly: body.interior
  haynes:
    section: 47
    spec_page: 233
  variant:
    factory_1963: true
    as_fitted: true
    body: roadster
  finish: vinyl_black

