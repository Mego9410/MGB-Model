# Doors, 1962-67 roadster ("pull-handle" cars). Haynes Ch 12 Sec 29 (early tourer door trim), Sec 32 (doors and hinges:
# three screws each hinge), Sec 34-35 and Fig 12.13 (printed p228-229: the early exterior pull handle and lock), Sec 39
# and Fig 12.15 (printed p230: early tourer door interior: ventilator, regulator, glass channels), Sec 21 (quarter-light).
# The 1963 roadster has wind-up glass and quarter-lights from launch (Fig 12.15), not sidescreens.
defaults:
  system: body
  assembly: body.doors
  haynes: { section: 32, spec_page: 229 }
  variant: { factory_1963: true, as_fitted: true, body: roadster }
  finish: paint_body_red

parts:
  - id: body.doors.skin-l
    name: Door outer skin, left
    haynes: { section: 32 }
    quantity: 1
    notes: "The door's outer panel inside the shut lines (4 mm gaps), its top rolling over to the waist; the pull handle's and lock's holes are in the door frame part. QA fix 1: the front shut line is straight at x -701 up to h 690, then curves rearward to a pointed top front corner on the waist at x -803 (Oliver's keyframes kf044, kf046, kf016 traced and back-projected on the SfM cameras); the lower corners about R110 (kf048, kf047); the pressed oval finger recess under the handle, about 130 x 55 and 13 deep, centred x -1490, h 780 (kf048, kf187, kf188)."
    specs:
      half_width: { in: [29.925, 29.975], mm: [760.10, 761.37], source: { label: S, ref: "https://www.mgexp.com/article/mgb-specification.72", note: "Overall width 59.9 in at the doors" } }
      length: { mm: 922.0, source: { label: D, method: "Shut lines at the bottom: x -701 (Oliver's keyframes kf044, kf046, kf016 on the SfM cameras) and -1623 (profile photo 29; body_shell_layout DOOR_*)" } }

  - id: body.doors.skin-r
    name: Door outer skin, right
    haynes: { section: 32 }
    quantity: 1
    notes: "Mirror of the left."
    specs:
      half_width: { in: [29.925, 29.975], mm: [760.10, 761.37], source: { label: S, ref: "https://www.mgexp.com/article/mgb-specification.72", note: "Overall width 59.9 in" } }

  - id: body.doors.frame-l
    name: Door frame (inner panel and shut faces), left
    haynes: { section: 39, figures: [{ figure: "12.15" }] }
    quantity: 1
    notes: >
      The inner panel parallel to the skin 72 mm inboard with two access apertures (Fig 12.15: the regulator, its
      extension and the remote control are reached through them), the front shut face with the two hinges' tapping
      plate holes, the rear shut face with the lock's screw holes, the bottom closing the box, the waist reinforcement
      under the glass slot.
    specs:
      depth: { mm: 72.0, source: { label: D, method: "Skin to inner panel: takes the wind-up glass and regulator" } }

  - id: body.doors.frame-r
    name: Door frame (inner panel and shut faces), right
    haynes: { section: 39, figures: [{ figure: "12.15" }] }
    quantity: 1
    notes: "Mirror of the left."
    specs:
      depth: { mm: 72.0, source: { label: D, method: "As the left" } }

  - id: body.doors.hinge-lower-l
    name: Door hinge, lower left
    haynes: { section: 32 }
    quantity: 1
    finish: paint_body_red
    notes: "Body leaf on the hinge pillar, door leaf on the front shut face, three screws each (Sec 32 para 1), on a pin."
    specs:
      pin_diameter: { mm: 6.4, source: { label: D, method: "1/4 in hinge pin" } }
  - id: body.doors.hinge-upper-l
    name: Door hinge, upper left
    haynes: { section: 32 }
    quantity: 1
    notes: "As the lower."
    specs:
      pin_diameter: { mm: 6.4, source: { label: D, method: "1/4 in hinge pin" } }
  - id: body.doors.hinge-lower-r
    name: Door hinge, lower right
    haynes: { section: 32 }
    quantity: 1
    notes: "Mirror of the left."
    specs:
      pin_diameter: { mm: 6.4, source: { label: D, method: "1/4 in hinge pin" } }
  - id: body.doors.hinge-upper-r
    name: Door hinge, upper right
    haynes: { section: 32 }
    quantity: 1
    notes: "Mirror of the left."
    specs:
      pin_diameter: { mm: 6.4, source: { label: D, method: "1/4 in hinge pin" } }

  - id: body.doors.glass-l
    name: Door glass, left
    haynes: { section: 39, figures: [{ figure: "12.17", legend: 1 }] }
    quantity: 1
    finish: glass_screen
    notes: >
      Wind-up toughened glass, shown raised: its front edge in the quarter-light's divider post channel, leaning back
      15 deg with the post (QA fix round 1: Oliver's scan and kf048, kf015, kf016), the rear edge raked, the top under the hood, leaning in 7 deg with the tumblehome; the lower channel the regulator's arm studs
      engage (Sec 39) at its bottom edge inside the door.
    specs:
      thickness: { mm: 4.0, source: { label: D, method: "Toughened side glass" } }
  - id: body.doors.glass-r
    name: Door glass, right
    haynes: { section: 39, figures: [{ figure: "12.17", legend: 1 }] }
    quantity: 1
    finish: glass_screen
    notes: "Mirror of the left."
    specs:
      thickness: { mm: 4.0, source: { label: D, method: "Toughened side glass" } }

  - id: body.doors.quarter-light-frame-l
    name: Quarter-light frame, left
    haynes: { section: 21, figures: [{ figure: "12.15", legend: 1 }] }
    quantity: 1
    finish: chrome
    notes: >
      Outer chrome frame of the ventilator at the door's front top corner (QA fix round 1): a slim flat chrome channel
      about 18 mm wide with rounded corners, its opening following the pivoting vent's big rounded lower-front corner so the
      corner below it is filled with chrome; the front edge behind the screen pillar with the two rubber strips between,
      toed in to close on the pillar; the rear post leaning back 15 deg (foot x -1032 at the door top, top x -1105 at
      h 1150) and running on down into the door as the door glass's front channel to its securing bracket and nuts
      (Fig 12.15 item 1), with a front tongue to the front nut. Sources: Oliver's body scan (the chrome frame both sides:
      lean 15.0 left, 15.5 right), the front edge from the black strips found row by row in kf046 and kf048 and
      ray-cast with their SfM cameras (-806 at the door top, -991 at h 1150), keyframes kf015, kf016, close-ups
      kf231, kf232 (shape only); Haynes Fig 12.15. Datums in mgb.side_glass_layout.
    specs:
      post_foot_x: { mm: -1032.0, display_only: true, source: { label: D, method: "Oliver's body scan, chrome frame's rear edge at the door top (side_glass_layout QL_REAR_FOOT_X)" } }
      post_lean: { deg: 15.0, display_only: true, source: { label: D, method: "Oliver's body scan (15.0 L, 15.5 R) and kf014-kf016 (14-16)" } }
      band_width: { mm: 18.0, display_only: true, source: { label: D, method: "kf048 at 4x: strip to inner rubber 17-20 mm, ray-cast" } }
  - id: body.doors.quarter-light-frame-r
    name: Quarter-light frame, right
    haynes: { section: 21, figures: [{ figure: "12.15", legend: 1 }] }
    quantity: 1
    finish: chrome
    notes: "Mirror of the left."
    specs:
      post_foot_x: { mm: -1032.0, display_only: true, source: { label: D, method: "As the left" } }
      post_lean: { deg: 15.0, display_only: true, source: { label: D, method: "As the left" } }
  - id: body.doors.quarter-light-glass-l
    name: Quarter-light glass, left
    haynes: { section: 21 }
    quantity: 1
    finish: glass_screen
    notes: "Ventilator glass in the pivoting vent frame's glazing rubber, with the vent's big rounded lower-front corner (kf048 full res, kf231, kf232)."
    specs:
      thickness: { mm: 4.0, source: { label: D, method: "As the door glass" } }
  - id: body.doors.quarter-light-glass-r
    name: Quarter-light glass, right
    haynes: { section: 21 }
    quantity: 1
    finish: glass_screen
    notes: "Mirror of the left."
    specs:
      thickness: { mm: 4.0, source: { label: D, method: "As the door glass" } }
  - id: body.doors.quarter-light-vent-l
    name: Quarter-light vent frame, left
    haynes: { section: 21, figures: [{ figure: "12.15" }] }
    quantity: 1
    finish: chrome
    notes: >
      The pivoting ventilator's inner chrome frame round the glass (QA fix round 1), a narrow channel with the big
      rounded lower-front corner (about R70), on its pivot pins top and bottom; the chrome catch on its front post at
      mid-height (a lever with a round knob, pivoted on a base on the vent, locking on a keeper on the outer frame);
      the triangular diamond-knurled pivot base plate on its bottom rail. Shapes from Oliver's kf048 (full res, zoomed),
      kf231, kf232, kf233-kf235 (close-ups, shape only) and Haynes Fig 12.15 (the vent and its lower pivot).
    specs:
      corner_radius: { mm: 72.0, display_only: true, source: { label: D, method: "kf048 full res scaled on the frame's 242 mm foot" } }
      catch_height: { mm: 1000.0, display_only: true, source: { label: D, method: "kf048, kf231: the catch at about mid-height of the front post" } }
  - id: body.doors.quarter-light-vent-r
    name: Quarter-light vent frame, right
    haynes: { section: 21, figures: [{ figure: "12.15" }] }
    quantity: 1
    finish: chrome
    notes: "Mirror of the left (kf186-kf194 close-ups of the right side)."
    specs:
      corner_radius: { mm: 72.0, display_only: true, source: { label: D, method: "As the left" } }
  - id: body.doors.glass-channel-l
    name: Door glass rear run channel, left
    haynes: { section: 39, figures: [{ figure: "12.15" }] }
    quantity: 1
    finish: paint_black
    notes: "Felt-lined U channel inside the door the glass's rear edge runs in, from the regulator's reach up to the waist, on the rear shut face (the glass runs the whole length of the door: Oliver's photos 08, 09, 23)."
    specs:
      length: { mm: 286.0, display_only: true, source: { label: D, method: "Waist less 20 down to 540 above the road" } }
  - id: body.doors.glass-channel-r
    name: Door glass rear run channel, right
    haynes: { section: 39, figures: [{ figure: "12.15" }] }
    quantity: 1
    finish: paint_black
    notes: "Mirror of the left."
    specs:
      length: { mm: 286.0, display_only: true, source: { label: D, method: "As the left" } }
  - id: body.doors.quarter-light-seal-l
    name: Quarter-light rubbers, left
    haynes: { section: 21 }
    quantity: 1
    finish: rubber
    notes: >
      The quarter-light's black rubbers (QA fix round 1): the two strips between the windscreen pillar and the frame,
      one on the frame's front edge and one on the pillar's rear edge, closing the gap (no light between them); the
      seal between the outer frame and the pivoting vent all round; and the vent's glazing rubber round the glass.
      Oliver's kf048 (full res), kf231, kf232, photos 09, 27.
    specs:
      strip_width: { mm: 9.0, display_only: true, source: { label: D, method: "kf048 full res: two dark strips in the 22 mm between the pillar and the frame" } }
  - id: body.doors.quarter-light-seal-r
    name: Quarter-light front seal, right
    haynes: { section: 21 }
    quantity: 1
    finish: rubber
    notes: "Mirror of the left."
    specs:
      strip_width: { mm: 9.0, display_only: true, source: { label: D, method: "As the left" } }

  - id: body.doors.pull-handle-l
    name: Exterior pull handle, left
    haynes: { section: 34, figures: [{ figure: "12.13", legend: 1 }] }
    quantity: 1
    finish: chrome
    notes: >
      The early pull handle (Fig 12.13 item 1, early Sports Tourer) as on Oliver's car (QA fix round 1): a chrome
      escutcheon screwed to the skin at the rear with a lower lip running forward, the lever hinged inside it and
      sweeping forward over the pressed finger recess, tapering and curving down to a black rubber buffer on its tip
      (handle-buffer); 174 mm overall from x -1608 to -1434 at h 790. The key lock is separate, below the side strip
      (door-mechanisms lock-barrel). Oliver's kf048 (full res, ray-cast on the door side), kf187-kf189 (close-ups,
      shape only).
    specs:
      length: { mm: 174.0, display_only: true, source: { label: D, method: "kf048 ray-cast on the door side: escutcheon rear x -1608 to buffer front x -1434" } }
  - id: body.doors.pull-handle-r
    name: Exterior pull handle, right
    haynes: { section: 34, figures: [{ figure: "12.13", legend: 1 }] }
    quantity: 1
    finish: chrome
    notes: "Mirror of the left."
    specs:
      length: { mm: 174.0, display_only: true, source: { label: D, method: "As the left" } }
  - id: body.doors.handle-buffer-l
    name: Pull handle buffer, left
    haynes: { section: 34, figures: [{ figure: "12.13", legend: 1 }] }
    quantity: 1
    finish: rubber
    notes: "Black rubber ball on the pull handle lever's front tip, resting on the skin (Oliver's kf188, kf189, kf048)."
    specs:
      diameter: { mm: 14.0, display_only: true, source: { label: D, method: "kf189 scaled on the lever" } }
  - id: body.doors.handle-buffer-r
    name: Pull handle buffer, right
    haynes: { section: 34, figures: [{ figure: "12.13", legend: 1 }] }
    quantity: 1
    finish: rubber
    notes: "Mirror of the left."
    specs:
      diameter: { mm: 14.0, display_only: true, source: { label: D, method: "As the left" } }

  - id: body.doors.striker-l
    name: Door striker, left
    haynes: { section: 27, figures: [{ figure: "12.13", legend: 9 }] }
    quantity: 1
    finish: zinc_steel
    notes: "Striker plate on the shut pillar, three screws, adjustable on its tapping plate (Sec 27)."
    specs:
      screws: { count: 3, source: { label: D, method: "Striker fixings" } }
  - id: body.doors.striker-r
    name: Door striker, right
    haynes: { section: 27, figures: [{ figure: "12.13", legend: 9 }] }
    quantity: 1
    finish: zinc_steel
    notes: "Mirror of the left."
    specs:
      screws: { count: 3, source: { label: D, method: "Striker fixings" } }
  - id: body.doors.mirror
    name: Door mirror (driver's side)
    haynes: { section: 21 }
    quantity: 1
    finish: chrome
    notes: >
      Rectangular chrome mirror head with rounded corners and a domed back on a ball joint, a short arm out from a split
      clamp with two screws round the right-hand quarter-light's leaning rear post, about 90 mm above the door top (QA
      fix round 1: head centre h about 950, x about -1065 from the kf015 ray-cast; shape from kf191-kf194 close-ups;
      Oliver's photos 08, 15, 23).
    specs:
      head_height: { mm: 116.0, source: { label: D, method: "Oliver's photo 08 against the quarter-light post" } }
      head_centre_h: { mm: 952.0, display_only: true, source: { label: D, method: "kf015 ray-cast on the quarter-light's plane (head centre h about 950)" } }
      head_width: { mm: 76.0, source: { label: D, method: "Oliver's photo 08" } }
  - id: body.doors.mirror-glass
    name: Door mirror glass
    haynes: { section: 21 }
    quantity: 1
    finish: glass_screen
    notes: "The mirror's glass, facing rearward."
    specs:
      height: { mm: 106.0, source: { label: D, method: "Inside the head's rim" } }
