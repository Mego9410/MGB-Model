# Bright work, 1962-67 roadster. Haynes Ch 12 Sec 7 (early grille: three top steady bracket screws, three bolts to the
# radiator duct panel; photo 7.1), Sec 10 and Fig 12.1 (printed p218: front bumper on two spring bars and a steady
# bracket, overriders on nuts and distance pieces; the rear bar, its spring bar and mounting brackets, overriders with
# the number plate lamps, P10), the wing chrome strip 14.25 in above the hub (mgexp.com ride height survey, 1963
# roadster). Forms from Fig 12.1 and the intro photographs; sizes derived. The boot lid's badges carry their raised
# lettering as chrome forms (QA fix round 1: the MG octagon and the M-G-B letter badge, from Oliver's photo 06); the
# grille's MG badge and the club badges likewise (QA fix round 1, front fittings: keyframes and registered scan). The
# number plates are blank: whether to model Oliver's registration characters is his call (PLAN, open question).
defaults:
  system: body
  assembly: body.brightwork
  haynes:
    section: 10
    spec_page: 218
  variant:
    factory_1963: true
    as_fitted: true
    body: roadster
  finish: chrome

