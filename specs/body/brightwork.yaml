- id: body.brightwork.scuttle-vent
  name: Scuttle air intake grille
  haynes:
    section: 1
  quantity: 1
  notes: 'QA fix round 1 (front finding 4): the chrome frame on the scuttle top 20-30 mm behind the bonnet''s rear edge,
    centred on the car at x -492 (kf076+kf088+kf092 triangulated -470..-480, moved back clear of the bonnet; mgb/body_layout
    SCUTTLE_VENT_*), its height and tilt from the skin (body_layout.skin_point), bent to the scuttle''s crown. Form from
    Oliver''s close-ups kf195-202: a long trapezoid with rounded ends (the front edge longer, the ends leaning inboard
    toward the screen: tight corners in front, wide sweeps behind), a 9 mm rim, eight cells between seven bars that fan
    with the ends (kf198 shows the whole vent: eight openings, the end ones D-shaped; the QA note said seven), the frame
    6 mm proud. Mesh and intake are separate parts. Before: x -664..-601 on the screen seal, 300 long, 13 square slats.'
  specs:
    length:
      mm: 383.0
      source:
        label: D
        method: 'kf076+kf088+kf092 triangulation: tips y -191/+192'
    depth:
      mm: 56.0
      source:
        label: D
        method: Oliver's scan plan (QA finding 4, about 60 fore-aft); kf199 cells about square
    centre_x:
      mm: -492.0
      source:
        label: D
        method: 'kf076+kf088+kf092 triangulation: centre x -470..-480; taken 12 mm further back so the frame stands
