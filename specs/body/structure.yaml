    specs:
      arch_underside_z: { mm: -122.5, source: { label: D, method: "underbody_layout ARCH_Z (P9 BUMP_STRIKE)" } }
      floor_underside_z: { mm: -172.5, source: { label: D, method: "underbody_layout BOOT_FLOOR_Z (P11a)" } }

