    notes: "Square tube through the sill box a third of the way along the door ('jacking apertures', case of the bends)."
    specs:
      bore: { mm: 25.0, source: { label: D, method: "Takes the jack's arm" } }

  - id: body.structure.jack-socket-r
    name: Jacking socket, right
    haynes: { section: 1 }
    quantity: 1
