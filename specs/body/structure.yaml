    name: Inner wing and wheel house, right
    haynes: { section: 1 }
    quantity: 1
    notes: "Mirror of the left with the screws for P10's control box, fuse block, flasher and starter solenoid."
    specs:
      wall_y_640: { mm: 518.0, display_only: true, source: { label: D, method: "Oliver's engine-bay scan: the wall 640 above the road, x -300 to 250" } }

  - id: body.structure.front-apron
    name: Front apron and radiator duct
    haynes: { section: 7 }
    quantity: 1
    notes: >
      The vertical cross panel behind the bumper the horns bolt to (P10 HORN_PANEL_X, HORN_POS), between the legs; the
      grille's bottom ledge behind the mouth with its three bottom bolt holes (Sec 7 para 1); below and behind it the
      bay is open down to the front pan (Oliver's engine-bay scan), the duct's sides being the inner wings' fronts.
    specs:
      horn_panel_x: { mm: 590.0, source: { label: D, method: "body_layout HORN_PANEL_X (P10)" } }

