    notes: "Shut face at the door's front shut line with the two hinges' three bolt holes each (Sec 32), the kick panel inboard."
    specs:
      hinge_heights: { mm: [420.0, 735.0], source: { label: D, method: "Above the road, lower and upper hinges" } }

  - id: body.structure.hinge-pillar-r
    name: Hinge pillar, right
    haynes: { section: 32 }
    quantity: 1
    notes: "Mirror of the left."
