    notes: "Pairs of tabs for P11a's strap front clevis pins on the boot floor step (STRAP_PIN_FRONT) and rear hanger pins under the floor (HANGER_PIN), at both straps."
    specs:
      pin_hole: { mm: 6.8, source: { label: D, method: "Clearance for the 1/4 in clevis pins (MGOC CLZ427)" } }

