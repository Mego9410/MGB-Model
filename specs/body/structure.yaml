# Body shell inner structure, 1962-67 roadster ("pull-handle" cars). Haynes Ch 12 Sec 1 (printed p216): the combined
# body and underframe of welded steel construction; Sec 5 (p217) the shell is aligned on jigs (no jig dimensions are
# given). Mountings for the earlier phases come from their layout modules (P8 brake_layout, P9 front/rear_suspension
# and steering layouts, P10 body_layout, P11a underbody_layout and fuel_supply_layout). Outside text references: MGBs
# Made in Australia "The MGB case of the bends" (boxed three-member sills tied into the front and rear bulkheads,
# box front chassis members ending at the jacking aperture about a third of the way along the door, rear members
# ending behind the doors, the tunnel lowest and narrowest behind the door apertures, a square-section tube under the
# facia tying the kick panels together). No body drawing with dimensions and no photographs of a bare shell could be
# opened from the build machine, so every station is derived (mgb/body_shell_layout.py, parts/body/structure.py).
defaults:
  system: body
  assembly: body.structure
  haynes: { section: 1, spec_page: 216 }
  variant: { factory_1963: true, as_fitted: true, body: roadster }
  finish: paint_body_red

parts:
  - id: body.structure.tunnel
    name: Transmission tunnel
    haynes: { section: 1 }
    finish: underseal
    quantity: 1
    notes: >
      Pressed in two lengths: wide and tall at the bulkhead round the bellhousing and the clutch lever, over the
      gearbox, the overdrive's solenoid and the remote housing (P5a/P5b clearances in PLAN.md), narrowing behind the
      overdrive to the cabin faces P8's handbrake needs (underbody_layout TUNNEL_Y 122) over the propeller shaft
      ("lowest and narrowest behind the door apertures", MGBs Made in Australia). Flanges spot-welded to the floor
      halves; the gear lever aperture with the grommet retainer's four screw holes (Fig 6.3 items 161-166); the
      handbrake ratchet plate's three bolt holes and spigot hole in the right wall (P8 HB_PIVOT, ratchet_bolts); the
      speedometer cable grommet hole low on the right.
    specs:
      cabin_half_width_rear: { mm: 122.0, source: { label: D, method: "P8 handbrake wall (brake_layout TUNNEL_SIDE_Y)" } }
      top_at_bellhousing: { mm: -52.0, source: { label: D, method: "Car z: clears the bellhousing and remote housing tops (P5a)" } }
      sheet_thickness: { mm: 1.2, source: { label: D, method: "18 swg pressing" } }

  - id: body.structure.floor-l
    name: Floor half, left
    haynes: { section: 1 }
    finish: underseal
    quantity: 1
    notes: >
      Flat pan between the tunnel and the inner sill at underbody_layout FLOOR_Z, from the toe board to the heelboard,
      flanged up both edges, three pressed transverse ribs, seat runner captive-nut holes, two drain holes with bungs
      and the raised pad (5 mm) with the captive nuts for the gearbox crossmember's two left-hand 3/8 in UNF screws
      (chassis_layout REAR_XMEMBER_BOLTS at the published-by-P5b body face z -381.2).
    specs:
      underside_z: { mm: -386.0, source: { label: D, method: "underbody_layout FLOOR_Z (P11a)" } }

  - id: body.structure.floor-r
    name: Floor half, right
    haynes: { section: 1 }
    finish: underseal
    quantity: 1
    notes: >
      Mirror of the left half; also carries the screw holes for the P-clips of P8's rear brake pipe and P11a's fuel
      pipe under the floor (fuel_supply_layout CLIPS, FLOOR_Y).
    specs:
      underside_z: { mm: -386.0, source: { label: D, method: "underbody_layout FLOOR_Z (P11a)" } }

  - id: body.structure.floor-bung
    name: Floor drain bung
    haynes: { section: 2 }
    quantity: 4
    finish: rubber
    notes: "Rubber bung in each floor drain hole (Sec 2 para 4: keep the drain holes clear)."
    specs:
      diameter: { mm: 25.0, source: { label: D, method: "Bung for a 20 mm drain hole" } }

  - id: body.structure.toe-board-l
    name: Toe board, left
    haynes: { section: 1 }
    finish: underseal
    quantity: 1
    notes: "Sloping footwell panel from the bulkhead's foot (underbody_layout TOE_TOP) to the floor (TOE_FOOT), tunnel to the inner sill."
    specs:
      foot_x: { mm: -485.0, source: { label: D, method: "underbody_layout TOE_FOOT (P11a, from P8's brake pipe run)" } }

  - id: body.structure.toe-board-r
    name: Toe board, right
    haynes: { section: 1 }
    finish: underseal
    quantity: 1
    notes: "Mirror of the left; the battery cable grommet hole (P10 CABLE_GROMMET)."
    specs:
      foot_x: { mm: -485.0, source: { label: D, method: "underbody_layout TOE_FOOT (P11a)" } }

  - id: body.structure.bulkhead
    name: Bulkhead (dash panel)
    haynes: { section: 1 }
    quantity: 1
    notes: >
      Engine-side face at car_layout BULKHEAD_X, from the toe boards to under the scuttle, between the hinge pillars,
      arched over the tunnel mouth, two stiffening swages, the top flange turned back under the scuttle inner panel.
      The pedal box aperture inside the box's rear flange with its six bolt holes (P8 parts/brakes/master.py
      box_bolts; nuts behind the panel), the heater air opening on the centre line (early heater, Fig 12.27), the main
      harness grommet (P10 HARNESS_GROMMET) and three smaller grommet holes for the speedometer cable, oil gauge pipe
      and temperature capillary on the right, the four-way connection's bolt hole (P8 FOUR_WAY), the overdrive vacuum
      switch's screw holes (P10), the steering column hole (P9) and the fuel pipe clip screws (P11a CLIPS).
    specs:
      engine_face_x: { mm: -400.0, source: { label: D, method: "car_layout BULKHEAD_X" } }
      sheet_thickness: { mm: 1.2, source: { label: D, method: "18 swg pressing" } }

  - id: body.structure.column-toe-mount
    name: Steering column lower mounting cup
    haynes: { section: 1, figures: [{ figure: "11.6", legend: 65 }] }
    quantity: 1
    finish: paint_black
    notes: >
      Pressed cup welded to the bulkhead's cabin face, its face square to the column at P9's COLUMN_TOE_PLATE (40 mm
      behind the bulkhead), with the hole for the 1 1/2 in tube and the bottom bracket's two stud holes. P9 placed the
      bracket on "the toe board"; the toe board (P11a datums) is lower here, so the body carries this cup.
    specs:
      face_offset: { mm: 40.0, source: { label: D, method: "steering_layout TOE_BOARD_T at BULKHEAD_X - 40" } }

  - id: body.structure.clutch-hose-support
    name: Clutch hose bracket support
    haynes: { section: 1, figures: [{ figure: "5.3" }] }
    quantity: 1
    finish: paint_black
    notes: >
      Angle welded to the bulkhead's engine face under P4's pipe-to-hose bracket (clutch_layout HOSE_BRACKET), one 1/4
      in screw. P9 suggested moving the bracket to the chassis leg; the leg is 160 mm outboard of it, so the bracket
      keeps its place and the body supports it (see PLAN).
    specs:
      arm_length: { mm: 92.0, source: { label: D, method: "Bulkhead face to the bracket plus its foot" } }

  - id: body.structure.scuttle-inner
    name: Scuttle inner panel and facia rail
    haynes: { section: 1 }
    quantity: 1
    notes: >
      Closing panel under the scuttle top from the bulkhead flange back to ahead of P10's instrument cases, 58 mm under
      the top, with the wiper wheelbox holes (P10 WIPER_SPINDLES), and the square-section rail under the scuttle's rear
      edge, above the instruments, tying the kick panels together (MGBs Made in Australia).
    specs:
      depth_below_scuttle: { mm: 58.0, source: { label: D, method: "Room for the wheelboxes and rack tubes (P10)" } }

  - id: body.structure.wiper-motor-bracket
    name: Wiper motor bracket
    haynes: { section: 54 }
    quantity: 1
    finish: paint_black
    notes: "Hung from the scuttle inner panel on the left for P10's DR3A motor (WIPER_MOTOR), three screw holes."
    specs:
      screws: { count: 3, source: { label: D, method: "P10 motor bracket fixings" } }

  - id: body.structure.column-top-bracket
    name: Steering column upper bracket
    haynes: { section: 1, figures: [{ figure: "11.6", legend: 59 }] }
    quantity: 1
    finish: paint_black
    notes: "Pressed channel hung from the facia rail; the column clamp (Fig 11.6 item 59) bolts under it at P9's COLUMN_TOP_CLAMP."
    specs:
      bolt_spacing: { mm: 76.0, source: { label: D, method: "Clamp's two bolts either side of the column" } }

  - id: body.structure.front-leg-l
    name: Front chassis leg, left
    haynes: { section: 3, figures: [{ figure: "11.1" }] }
    finish: underseal
    quantity: 1
    notes: >
      Box-section member along the engine bay floor: level over the front crossmember with its underside on P9's upper
      rubber pads (front_suspension_layout BODY_FACE_Z) and top at BODY_LEG_TOP_Z where the support bolt nuts sit,
      holes and a spacer tube at both support bolts (BODY_BOLTS), forward to the front apron with the bumper spring
      bar bolt holes, back under the toe board and the floor to a third of the way along the door ("case of the
      bends": the front chassis member ends at the jacking aperture level). Ahead of and behind the crossmember the
      leg steps inboard to |y| 338 and narrows to 62 mm: the tyre's shoulder at full lock (28 deg front in, 37 deg
      rear in, for the published 32 ft turning circle) sweeps through the straight line, and P8's right front pipe
      runs at y -300 beside it.
    specs:
      centre_y: { mm: 432.0, source: { label: D, method: "front_suspension_layout BODY_BOLT_Y (P9)" } }
      width: { mm: 76.0, source: { label: D, method: "Over the crossmember shelf (P9 XM_SHELF_Y)" } }

  - id: body.structure.front-leg-r
    name: Front chassis leg, right
    haynes: { section: 3, figures: [{ figure: "11.1" }] }
    finish: underseal
    quantity: 1
    notes: "Mirror of the left."
    specs:
      centre_y: { mm: 432.0, source: { label: D, method: "front_suspension_layout BODY_BOLT_Y (P9)" } }

  - id: body.structure.inner-wing-l
    name: Inner wing and wheel house, left
    haynes: { section: 1 }
    quantity: 1
    notes: >
      Engine-bay valance and wheel arch dome as Oliver's engine-bay scan shows it (sections every 25 mm, both sides):
      from the chassis leg's top it slopes out and up as the inside of the dome to about |y| 520 at 640 above the road,
      then rises nearly vertical to a flange turned outward under the outer wing's top, where the wing bolts down
      through it; a stiffening swage along the wall; from the upper bulkhead face (above the shelf) to the front
      apron. The damper arm opening and the full-lock tyre openings P9's geometry needs are kept; the wheel house
      arches over the tyre (420 mm about the axle) out to the outer wing; two drain holes ahead of the wheel. The units
      hang on body.structure.inner-wing-brackets.
    specs:
      wall_y_640: { mm: 518.0, display_only: true, source: { label: D, method: "Oliver's engine-bay scan: the wall 640 above the road, x -300 to 250" } }
      wheel_house_radius: { mm: 420.0, source: { label: D, method: "Tyre radius 309 plus bump travel and clearance" } }

