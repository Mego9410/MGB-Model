    haynes: { section: 1 }
    finish: underseal
    quantity: 1
    notes: "Inner wall at |y| 498 outboard of the rear rail, the arched band over the tyre (430 mm about the axle: the tyre at full bump) out to the outer wing."
    specs:
      radius: { mm: 430.0, source: { label: D, method: "Tyre radius plus P9's bump travel (52 mm gap, 44 mm rubber) and clearance" } }

  - id: body.structure.rear-wheelhouse-r
    name: Rear wheel house, right
    haynes: { section: 1 }
    finish: underseal
    quantity: 1
