    specs:
      inner_y: { mm: 600.0, source: { label: D, method: "underbody_layout SILL_Y (P11a)" } }
      tread_height: { mm: 330.0, source: { label: D, method: "Above the road: the door bottom shuts outboard of it" } }

  - id: body.structure.inner-sill-r
