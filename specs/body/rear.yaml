# Rear outer panels and boot lid, 1962-67 roadster. Haynes Ch 12 Sec 25-26 (printed p226-227: the boot lid on two hinges,
# its lock, Fig 12.12); intro photographs for the forms. Shape from mgb/body_shell_layout.py (derived); width published.
defaults:
  system: body
  assembly: body.rear
  haynes: { section: 26, spec_page: 227 }
  variant: { factory_1963: true, as_fitted: true, body: roadster }
  finish: paint_body_red

parts:
  - id: body.rear.rear-wing-l
    name: Rear wing, left
    haynes: { section: 1 }
    quantity: 1
    notes: >
      Welded rear wing from the door's rear shut line to the tail, outboard of the rear deck and boot lid, round the
      tail corner to the rear panel seam; the wheel arch opening; the crown line standing a little proud of the deck;
      the lamp fixings in the wing end (P10 REAR_LAMP_*: two bulb holder holes, three screw holes).
    specs:
      half_width: { in: [29.925, 29.975], mm: [760.10, 761.37], source: { label: S, ref: "https://www.mgexp.com/article/mgb-specification.72", note: "Overall width 59.9 in" } }
      arch_radius: { mm: 378.0, source: { label: D, method: "profile photo 29 scaled on the wheelbase: a circle fitted to the arch edge, centre 22 mm behind and 30 mm below the hub" } }

  - id: body.rear.rear-wing-r
    name: Rear wing, right
    haynes: { section: 1 }
    quantity: 1
    notes: "Mirror of the left."
    specs:
      half_width: { in: [29.925, 29.975], mm: [760.10, 761.37], source: { label: S, ref: "https://www.mgexp.com/article/mgb-specification.72", note: "Overall width 59.9 in" } }

  - id: body.rear.rear-deck
    name: Rear deck (shroud)
    haynes: { section: 1 }
    quantity: 1
    notes: "The panel behind the cockpit over the hood stowage well, between the rear wings, to the boot lid's front gap: a narrow strip from the cockpit's rear rim (x -2055) to the lid's front edge (x -2246), about 900 above the road at the centre (QA fix 1: Oliver's scan, sections from inside the cockpit at y -350, 0, 385 and the plan; kf104, kf105). Its seams to the rear wings are leaded, flush."
    specs:
      cockpit_rear_x: { mm: -2055.0, source: { label: D, method: "Oliver's body scan: the cockpit's rear rim and rear wall at x -2050..-2080 in the sections at y -350, 0 and 385" } }

  - id: body.rear.boot-skin
    name: Boot lid (outer skin)
    haynes: { section: 26 }
    quantity: 1
    notes: "Boot lid between the rear wings, flat across (8 mm camber) in the dip below the wing crowns, its front edge behind the rear deck (x -2246, Oliver's scan), rounding off at the back higher and further back than before (QA fix 1: through about x -2853 at h 770, between the handle evidence and the scan, about 804 at the centre over the lamp tops, Oliver's photo 25 and kf062; his own words: the lid a bit lower than the lights), to its rear edge over the number plate; a soft rounded rectangle, front corners R150 in plan, lower corners R90 seen from behind (photo 25, kf058, kf062, kf071, kf105); 4 mm gaps."
    specs:
      rear_edge_height: { mm: 665.0, source: { label: D, method: "Above the road, 25-34 mm above the number plate's top (Oliver's photo 25 scaled on the plate, kf062)" } }

  - id: body.rear.rear-panel
    name: Rear panel
    haynes: { section: 14 }
    quantity: 1
    notes: "The tail panel below the boot lid and round its rounded lower corners, between the wing ends, behind the bumper (underbody_layout REAR_PANEL_X), carrying the number plate and, right of it, the filler cap's neck (Oliver's photos 11, 18, 21). QA fix 1: outboard of the overriders it rounds forward into the wing ends (Oliver's scan at |y| 450-550: x -2893..-2924); under the bumper the valance turns forward and under, showing to about 385 above the road from behind (photo 25) and ending 345 above the road at x -2880 (scan); its seams to the wings are leaded, flush."
    specs:
      face_x: { mm: -2955.3, source: { label: D, method: "underbody_layout REAR_PANEL_X (moved by P11b: profile photo 29)" } }

  - id: body.rear.boot-frame
    name: Boot lid inner frame
    haynes: { section: 26 }
    quantity: 1
    notes: "Perimeter band following the skin 20 mm under it and an X-shaped brace corner to corner (Oliver's photo 14)."
    specs:
      band_width: { mm: 49.0, source: { label: D, method: "6 to 55 mm in from the edge" } }

  - id: body.rear.boot-hinge-l
    name: Boot lid hinge, left
    haynes: { section: 26 }
    quantity: 1
    finish: chrome
    notes: "Cranked arm from the rear deck under the lid's front edge (Sec 26)."
    specs:
      bolts: { count: 2, source: { label: D, method: "Two bolts each leaf" } }
  - id: body.rear.boot-hinge-r
    name: Boot lid hinge, right
    haynes: { section: 26 }
    quantity: 1
    finish: chrome
    notes: "Mirror of the left."
    specs:
      bolts: { count: 2, source: { label: D, method: "Two bolts each leaf" } }

  - id: body.rear.boot-handle
    name: Boot lid handle and lock barrel
    haynes: { section: 25, figures: [{ figure: "12.12" }] }
    quantity: 1
    finish: chrome
    notes: "Chrome pear-shaped escutcheon with the push-button lock barrel and keyhole in its round head (Fig 12.12 items 3-5: the pushbutton assembly, its pear-shaped seal and retaining ring), domed off the lid, pointed at the bottom with a grip ridge down to the point. On the lid's rear fall at x -2905, square to the skin (mgb.rear_fittings_layout); Oliver's photo 25 puts its centre about 770 above the road, which it reaches when the lid's fall is refitted (QA rear finding 2). QA fix round 1 (was a 150 mm bar at 680): photo 25 zoomed, kf062, kf105, kf173."
    specs:
      width: { mm: 45.0, source: { label: D, method: "Oliver's photo 25 scaled on the plate (44 mm)" } }
      height: { mm: 60.0, source: { label: D, method: "Oliver's photo 25 scaled on the plate (61 mm)" } }

  - id: body.rear.boot-lock
    name: Boot lock and striker
    haynes: { section: 25, figures: [{ figure: "12.12" }] }
    quantity: 1
    finish: zinc_steel
    notes: "Lock inside the lid behind the handle, square to the skin and 3 mm under it (QA fix round 1: its flange no longer shows through the sloping lid), on its two securing screws (Fig 12.12 items 1, 2), the operating lever (item 7) and claw reaching down to the striker on the rear panel's top edge (Sec 25)."
    specs:
      body_width: { mm: 60.0, source: { label: D, method: "Lock body" } }

  - id: body.rear.spare-clamp
    name: Spare wheel clamp
    haynes: { section: 12 }
    quantity: 1
    finish: zinc_steel
    notes: "Stud from the boot floor through the spare wire wheel's centre, clamp bar and wing nut. The spare is P9's wheel, tyre and valve (wheels.road-wheels) lying on the boot floor's locating ring, without a spinner (PLAN: P9 carried over)."
    specs:
      stud: { mm: 9.5, source: { label: D, method: "3/8 in stud" } }

  - id: body.rear.jack
    name: Jack
    haynes: { section: 1 }
    quantity: 1
    finish: paint_black
    notes: "Side-lift screw jack whose arm enters the sill's jacking socket, stowed on the boot floor beside the spare (form derived)."
    specs:
      length: { mm: 360.0, source: { label: D, method: "Stowed length" } }

  - id: body.rear.hammer
    name: Spinner mallet
    haynes: { section: 1 }
    quantity: 1
    finish: copper
    notes: "Copper and hide mallet for the wire wheels' knock-off spinners (the wire wheel car's wheel brace), in the boot."
    specs:
      head_diameter: { mm: 52.0, source: { label: D, method: "Mallet head" } }
  - id: body.rear.boot-carpet
    name: Boot floor carpet
    haynes: { section: 3 }
    quantity: 1
    finish: carpet
    notes: "Black carpet on the boot floor under the spare wire wheel (Oliver's photo 26), cut round the wheel's locating ring."
    specs:
      thickness: { mm: 6.0, source: { label: D, method: "Carpet with its felt backing" } }
