# Gear selector mechanism: rods, forks and their bolts, the detent block with balls and springs,
# the selectors on the rod ends, the interlock plate and the front selector lever.
# Early three-synchro gearbox, overdrive car, 1963.
# Haynes Ch 6: Sec 4 paras 6, 8-9 (p113); Sec 7 paras 9-17 (p123); Fig 6.3 items 2, 49-75, 82,
# 119-121, 125 (p114-115); photos 4.21(a)-(c), 7.9, 7.10(a)/(b), 7.11(a)/(b), 7.12.
# Legend numbers for the three rods and forks are matched to their parts from the drawing (D).
# Positions: mgb/gearbox_layout.py (ROD_*, SEL_*, FINGER_D), all D.
defaults:
  system: gearbox
  assembly: gearbox.selectors
  haynes: { section: 7, spec_page: 111 }
  variant: { factory_1963: true, as_fitted: true, overdrive: true }
  finish: machined_steel

parts:
  - id: gearbox.selectors.rod-12
    name: First and second gear selector rod
    haynes: { section: 4, figures: [{ figure: "6.3", legend: 57 }] }
    quantity: 1
    notes: "Removed last of the three, after reverse and 3rd/4th (Sec 4 para 9). Three detent notches near the rear end; cross holes for the fork and selector bolts."
    specs:
      diameter: { in: 0.4375, mm: 11.1125, source: { label: D, method: "7/16 in, in proportion to Fig 6.3" } }

  - id: gearbox.selectors.rod-34
    name: Third and fourth gear selector rod
    haynes: { section: 4, figures: [{ figure: "6.3", legend: 62 }] }
    quantity: 1
    specs:
      diameter: { in: 0.4375, mm: 11.1125, source: { label: D, method: "7/16 in, in proportion to Fig 6.3" } }

  - id: gearbox.selectors.rod-rev
    name: Reverse selector rod
    haynes: { section: 4, figures: [{ figure: "6.3", legend: 64 }] }
    quantity: 1
    notes: "Removed first (Sec 4 para 9). If the rods are tight, take the front cover off and tap them out with a soft drift."
    specs:
      diameter: { in: 0.4375, mm: 11.1125, source: { label: D, method: "7/16 in, in proportion to Fig 6.3" } }

  - id: gearbox.selectors.distance-piece
    name: Third and fourth rod distance tube
    haynes: { section: 4, figures: [{ figure: "6.3", legend: 63 }] }
    quantity: 1
    notes: "Over the 3rd/4th rod behind its fork, on some models (Sec 4 para 9); ensure it is fitted (Sec 7 para 10)."
    specs:
      length: { mm: 40.0, source: { label: D, method: "Fork boss to the next stop" } }

  - id: gearbox.selectors.fork-12
    name: First and second gear selector fork
    haynes: { section: 4, figures: [{ figure: "6.3", legend: 49 }] }
    quantity: 1
    notes: "Engages the collar on first gear. Place the forks first/second, reverse, then third/fourth (Sec 7 para 9, photo 7.9)."
    specs:
      tip_thickness: { mm: 5.0, source: { label: D, method: "In the 6 mm groove in the first gear collar" } }

  - id: gearbox.selectors.fork-34
    name: Third and fourth gear selector fork
    haynes: { section: 4, figures: [{ figure: "6.3", legend: 53 }] }
    quantity: 1
    specs:
      tip_thickness: { mm: 6.0, source: { label: D, method: "In the 8 mm coupling sleeve groove" } }

  - id: gearbox.selectors.fork-rev
    name: Reverse selector fork
    haynes: { section: 4, figures: [{ figure: "6.3", legend: 58 }] }
    quantity: 1
    notes: "A dog-leg arm down the left of the gear train to a shoe in the reverse idler's groove (form derived; Fig 6.3 item 58, photo 4.21c)."
    specs:
      tip_thickness: { mm: 4.4, source: { label: D, method: "In the 5.5 mm idler groove" } }

  - id: gearbox.selectors.fork-bolt
    name: Fork locating bolt
    haynes: { section: 4, figures: [{ figure: "6.3", legend: 50 }, { figure: "6.3", legend: 54 }, { figure: "6.3", legend: 59 }] }
    quantity: 3
    finish: zinc_steel
    notes: "Through the fork boss into the hole in the rod; tighten firmly and secure the locknut (Sec 7 para 11). MGOC Spares 2A3492."
    specs:
      length: { in: 0.75, mm: 19.05, source: { label: D, method: "Through the boss into the rod" } }

  - id: gearbox.selectors.fork-washer
    name: Fork bolt washer
    haynes: { section: 4, figures: [{ figure: "6.3", legend: 51 }, { figure: "6.3", legend: 55 }, { figure: "6.3", legend: 60 }] }
    quantity: 3
    finish: zinc_steel
    notes: "Shakeproof washer (MGOC Spares GHF321)."
    specs:
      outside_diameter: { mm: 12.0, source: { label: D, method: "1/4 in shakeproof" } }
      inside_diameter: { mm: 6.6, source: { label: D, method: "1/4 in" } }
      thickness: { mm: 0.6, source: { label: D, method: "1/4 in shakeproof" } }

  - id: gearbox.selectors.fork-locknut
    name: Fork bolt locknut
    haynes: { section: 4, figures: [{ figure: "6.3", legend: 52 }, { figure: "6.3", legend: 56 }, { figure: "6.3", legend: 61 }] }
    quantity: 3
    finish: zinc_steel
    specs:
      thread_diameter: { in: 0.25, source: { label: D, method: "1/4 in UNF" }, display_only: true }

  - id: gearbox.selectors.detent-block
    name: Selector rod block
    haynes: { section: 4, figures: [{ figure: "6.3", legend: 67 }] }
    quantity: 1
    notes: "Bolted to the casing rear face on two dowels; holds a ball and spring on each rod (Sec 4 para 9, Sec 7 para 10, photo 7.10a)."
    specs:
      thickness: { mm: 18.0, source: { label: D, method: "Fig 6.3 item 67" }, display_only: true }

  - id: gearbox.selectors.detent-ball
    name: Detent ball
    haynes: { section: 4, figures: [{ figure: "6.3", legend: 65 }] }
    quantity: 3
    finish: bearing
    specs:
      diameter: { in: 0.25, mm: 6.35, source: { label: D, method: "Fig 6.3 item 65" } }

  - id: gearbox.selectors.detent-spring
    name: Detent spring
    haynes: { section: 4, figures: [{ figure: "6.3", legend: 66 }] }
    quantity: 3
    finish: spring_steel
    specs:
      free_length: { mm: 10.0, source: { label: D, method: "Ball to the top of the block bore" } }
      wire_diameter: { mm: 1.0, source: { label: D, method: "Fig 6.3 item 66" } }
      outside_diameter: { mm: 6.6, source: { label: D, method: "In the 7.2 mm bore" } }

  - id: gearbox.selectors.block-screw
    name: Selector rod block screw
    haynes: { section: 4, figures: [{ figure: "6.3", legend: 68 }] }
    quantity: 2
    finish: zinc_steel
    specs:
      length: { in: 1.0, mm: 25.4, source: { label: D, method: "Through the counterbored block into the case" } }

  - id: gearbox.selectors.block-washer
    name: Selector rod block washer
    haynes: { section: 4, figures: [{ figure: "6.3", legend: 69 }] }
    quantity: 2
    finish: zinc_steel
    notes: "Drawn under the block screw in Fig 6.3 (number 69 is missing from the printed legend)."
    specs:
      outside_diameter: { mm: 11.0, source: { label: D, method: "1/4 in spring washer" } }
      inside_diameter: { mm: 6.6, source: { label: D, method: "1/4 in spring washer" } }
      thickness: { mm: 1.6, source: { label: D, method: "1/4 in spring washer" } }

  - id: gearbox.selectors.selector-12
    name: First and second gear selector
    haynes: { section: 4, figures: [{ figure: "6.3", legend: 70 }] }
    quantity: 1
    notes: "Bolted and wired to the rear end of its rod (Sec 4 para 8, Sec 7 para 12). With all three fitted the cut-outs line up (photo 7.12)."
    specs:
      width: { mm: 18.0, source: { label: D, method: "gearbox_layout.SEL_D" }, display_only: true }

  - id: gearbox.selectors.selector-34
    name: Third and fourth gear selector
    haynes: { section: 4, figures: [{ figure: "6.3", legend: 72 }] }
    quantity: 1
    specs:
      width: { mm: 18.0, source: { label: D, method: "gearbox_layout.SEL_D" }, display_only: true }

  - id: gearbox.selectors.selector-rev
    name: Reverse gear selector
    haynes: { section: 4, figures: [{ figure: "6.3", legend: 74 }] }
    quantity: 1
    specs:
      width: { mm: 18.0, source: { label: D, method: "gearbox_layout.SEL_D" }, display_only: true }

  - id: gearbox.selectors.selector-screw
    name: Selector locating bolt
    haynes: { section: 4, figures: [{ figure: "6.3", legend: 71 }, { figure: "6.3", legend: 73 }, { figure: "6.3", legend: 75 }] }
    quantity: 3
    finish: zinc_steel
    notes: "Cross-drilled head for the locking wire."
    specs:
      length: { in: 0.5, mm: 12.7, source: { label: D, method: "Through the selector boss into the rod" } }

  - id: gearbox.selectors.locking-wire
    name: Selector bolt locking wire
    haynes: { section: 4 }
    quantity: 1
    finish: zinc_steel
    notes: "Cut through to remove the selectors (Sec 4 para 8); lock the bolt heads to the selectors with wire on assembly (Sec 7 para 12)."
    specs:
      diameter: { mm: 0.9, source: { label: D, method: "Soft locking wire" } }

  - id: gearbox.selectors.interlock-plate
    name: Interlock plate
    haynes: { section: 4, figures: [{ figure: "6.3", legend: 82 }] }
    quantity: 1
    notes: "Lift out the plate and its bracket (Sec 4 para 6); refit with its arms in the cut-outs of the selectors and the side plate in its recess (Sec 7 para 16). Shape derived from Fig 6.3 item 82 and photo 4.17c (later type)."
    specs:
      thickness: { mm: 7.0, source: { label: D, method: "Fills the selector slots" }, display_only: true }

  - id: gearbox.selectors.front-lever
    name: Front selector lever
    haynes: { section: 4, figures: [{ figure: "6.3", legend: 119 }] }
    quantity: 1
    notes: "Keyed and pinch-bolted to the front of the selector lever shaft; its finger sits in the selected selector (Sec 4 para 6: undo its bolt before the extension comes off, or it falls free; Sec 7 para 14)."
    specs:
      finger_radius: { mm: 51.5, source: { label: D, method: "Shaft axis to the selector slots" }, display_only: true }

  - id: gearbox.selectors.pinch-bolt
    name: Front selector lever bolt
    haynes: { section: 4, figures: [{ figure: "6.3", legend: 120 }] }
    quantity: 1
    finish: zinc_steel
    notes: "Leave it slack until the extension and interlock plate are on (Sec 7 paras 14, 17)."
    specs:
      length: { in: 0.75, mm: 19.05, source: { label: D, method: "Across the pinch lug" } }

  - id: gearbox.selectors.pinch-washer
    name: Front selector lever bolt washer
    haynes: { section: 4, figures: [{ figure: "6.3", legend: 121 }] }
    quantity: 1
    finish: zinc_steel
    specs:
      outside_diameter: { mm: 11.0, source: { label: D, method: "1/4 in spring washer" } }
      inside_diameter: { mm: 6.6, source: { label: D, method: "1/4 in spring washer" } }
      thickness: { mm: 1.6, source: { label: D, method: "1/4 in spring washer" } }
