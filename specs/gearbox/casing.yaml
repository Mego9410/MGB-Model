    notes: "The two bolts at the sides of the flange."
    specs:
      length: { in: 1.5, mm: 38.1, source: { label: D, method: "Flange boss 18 mm, rear plate, washer and nut" } }

  - id: gearbox.casing.bell-bolt-long
    name: Bellhousing bolt, long
    haynes: { section: 3, figures: [{ figure: "6.3", legend: 158 }] }
    quantity: 2
    finish: zinc_steel
    notes: "The two upper bolts through the deep bosses on the ears at the top of the flange."
    specs:
      length: { in: 2.75, mm: 69.85, source: { label: D, method: "Ear boss 46 mm, rear plate, washer and nut" } }

  - id: gearbox.casing.bell-nut
    name: Bellhousing nut
    haynes: { section: 3, figures: [{ figure: "6.3", legend: 159 }] }
    quantity: 8
    finish: zinc_steel
    specs:
      thread_diameter: { in: 0.375, source: { label: D, method: "Fits the 3/8 in holes in the engine rear plate" }, display_only: true }

  - id: gearbox.casing.bell-washer
    name: Bellhousing spring washer
    haynes: { section: 3, figures: [{ figure: "6.3", legend: 160 }] }
    quantity: 8
    finish: zinc_steel
    specs:
      outside_diameter: { mm: 15.5, source: { label: D, method: "3/8 in spring washer" } }
      inside_diameter: { mm: 9.8, source: { label: D, method: "3/8 in spring washer" } }
      thickness: { mm: 2.4, source: { label: D, method: "3/8 in spring washer" } }
