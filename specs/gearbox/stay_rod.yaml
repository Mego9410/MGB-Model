# Gearbox stay (steady) rod, three-synchromesh gearbox, early cars. Haynes Ch 1 Fig 1.29 items 20-32 (printed p52); Ch 1
# Sec 6 para 33 (the stay rod is detached from the gearbox before the crossmember comes off); Ch 6 Sec 14 para 1 (the
# steady rod bracket on the crossmember lies under the overdrive valves). Outside references: MGOC Spares "engine &
# gearbox mountings" (pin 1G9384 for the front bush, three-synchro gearbox; bush 1B8347; steady rod AHH6056; distance tube
# 1G8775; buffer 1G8781; buffer plate 1G8782). No outside photographs could be opened from the build machine; forms are
# from Fig 1.29. Positions in mgb/chassis_layout.py (STAY_*).
defaults:
  system: gearbox
  assembly: gearbox.stay-rod
  haynes: { section: 6, figures: [{ figure: "1.29" }] }
  variant: { factory_1963: true, as_fitted: true, gearbox: three_synchro_overdrive }
  finish: paint_black

parts:
  - id: gearbox.stay-rod.bracket
    name: Bracket
    haynes: { section: 6, figures: [{ figure: "1.29", legend: 20 }] }
    quantity: 1
    notes: "Screwed to the crossmember dip's two holes (P5b) with its upright to the left of the overdrive sump; position derived (the sump's plugs leave no room for the rod under it)."
    specs: {}

  - id: gearbox.stay-rod.bracket-screw
    name: Bracket screw
    haynes: { section: 6, figures: [{ figure: "1.29", legend: 21 }] }
    quantity: 2
    finish: zinc_steel
    specs:
      length: { in: 0.75, mm: 19.05, source: { label: D, method: "Bracket base and crossmember, nut under (P5b slot)" } }

  - id: gearbox.stay-rod.bracket-washer
    name: Bracket spring washer
    haynes: { section: 6, figures: [{ figure: "1.29", legend: 22 }] }
    quantity: 2
    finish: zinc_steel
    specs: {}

  - id: gearbox.stay-rod.rod
    name: Stay-rod
    haynes: { section: 6, figures: [{ figure: "1.29", legend: 23 }] }
    quantity: 1
    part_numbers:
      - { number: AHH6056, by: "MGOC Spares (steady rod, gearbox)", source: { label: S, ref: "https://www.mgocspares.co.uk/parts/mg/mgb/engine/engine-gearbox-mountings" } }
    notes: "Eye at the front round the rubber bushes on the pin, threaded rear end through the bracket between the buffers. Length derived."
    specs: {}

  - id: gearbox.stay-rod.buffer
    name: Buffer
    haynes: { section: 6, figures: [{ figure: "1.29", legend: 24 }] }
    quantity: 2
    finish: rubber
    part_numbers:
      - { number: 1G8781, by: "MGOC Spares (buffer, rubber, gearbox steady rod)", source: { label: S, ref: "https://www.mgocspares.co.uk/parts/mg/mgb/engine/engine-gearbox-mountings" } }
    specs:
      width: { mm: 28.0, source: { label: D, method: "Fig 1.29 proportions" } }
      thickness: { mm: 12.0, source: { label: D, method: "Fig 1.29 proportions" } }

  - id: gearbox.stay-rod.buffer-plate
    name: Buffer plate
    haynes: { section: 6, figures: [{ figure: "1.29", legend: 25 }] }
    quantity: 2
    finish: zinc_steel
    part_numbers:
      - { number: 1G8782, by: "MGOC Spares (plate, rubber buffer, gearbox steady rod)", source: { label: S, ref: "https://www.mgocspares.co.uk/parts/mg/mgb/engine/engine-gearbox-mountings" } }
    specs:
      width: { mm: 30.0, source: { label: D, method: "Over the buffer" } }

  - id: gearbox.stay-rod.distance-tube
    name: Distance tube for stay-rod
    haynes: { section: 6, figures: [{ figure: "1.29", legend: 26 }] }
    quantity: 1
    finish: zinc_steel
    part_numbers:
      - { number: 1G8775, by: "MGOC Spares (tube, distance, gearbox steady rod)", source: { label: S, ref: "https://www.mgocspares.co.uk/parts/mg/mgb/engine/engine-gearbox-mountings" } }
    specs:
      length: { mm: 41.0, source: { label: D, method: "Through both buffers and the bracket's upright" } }

  - id: gearbox.stay-rod.rod-washer
    name: Spring washer (rod)
    haynes: { section: 6, figures: [{ figure: "1.29", legend: 27 }] }
    quantity: 1
    finish: zinc_steel
    specs: {}

  - id: gearbox.stay-rod.rod-nut
    name: Nut (rod)
    haynes: { section: 6, figures: [{ figure: "1.29", legend: 28 }] }
    quantity: 1
    finish: zinc_steel
    specs: {}

  - id: gearbox.stay-rod.bush
    name: Bush
    haynes: { section: 6, figures: [{ figure: "1.29", legend: 29 }] }
    quantity: 2
    finish: rubber
    part_numbers:
      - { number: 1B8347, by: "MGOC Spares (bush, rubber, gearbox steady, front)", source: { label: S, ref: "https://www.mgocspares.co.uk/parts/mg/mgb/engine/engine-gearbox-mountings" } }
    specs: {}

  - id: gearbox.stay-rod.pin
    name: Pin
    haynes: { section: 6, figures: [{ figure: "1.29", legend: 30 }] }
    quantity: 1
    finish: zinc_steel
    part_numbers:
      - { number: 1G9384, by: "MGOC Spares (pin, front bush, gearbox steady rod, 3 synchro gearbox)", source: { label: S, ref: "https://www.mgocspares.co.uk/parts/mg/mgb/engine/engine-gearbox-mountings" } }
    notes: "Flange screwed under the left side of the gearbox casing (D: no pad is drawn on the P5a casing there), the pin hanging down through the rod's eye."
    specs: {}

  - id: gearbox.stay-rod.pin-screw
    name: Pin flange screw
    haynes: { section: 6 }
    quantity: 2
    finish: zinc_steel
    specs:
      length: { in: 0.75, mm: 19.05, source: { label: D, method: "Flange and the casing's tapped hole" } }

  - id: gearbox.stay-rod.pin-washer
    name: Spring washer (pin)
    haynes: { section: 6, figures: [{ figure: "1.29", legend: 31 }] }
    quantity: 1
    finish: zinc_steel
    specs: {}

  - id: gearbox.stay-rod.pin-nut
    name: Nut (pin)
    haynes: { section: 6, figures: [{ figure: "1.29", legend: 32 }] }
    quantity: 1
    finish: zinc_steel
    specs: {}
