# Front suspension, 1963 (coil springs, wishbones, lever dampers as upper arms, swivel pins and trunnions). Haynes
# Ch 11: specifications (printed p202-203), Sec 4 (p204), Sec 5 (p204), Sec 9 (p208), Sec 14 (p210), Sec 15
# (p210-211), Fig 11.1 (p204), Fig 11.2 (p205). Fig 11.2 item numbers.
# Outside references: MGOC Spares "front suspension" and "stub axles & hubs" (stub axle assemblies with trunnion
# BTB764 RH / BTB765 LH, king pin kits, top trunnion kits, dust tubes 1G4271 upper / 21B251 lower and spring
# 2K8951, king pin bushes ATC4246 top / BTB766 bottom, thrust washer ATC4264, lower trunnion seal AAA1323, steering
# arm bolt BTB410); British Parts Northwest AHH6451 front coil spring (350 lb/in, 9.9 in free, roadster 1963-72).
# No outside photographs could be opened from the build machine; forms are from Figs 11.1 and 11.2. Positions
# and the steering geometry in mgb/front_suspension_layout.py.
defaults:
  system: chassis
  assembly: chassis.front
  haynes: { section: 4, spec_page: 202 }
  variant: { factory_1963: true, as_fitted: true, rhd: true, lever_arm_dampers: true }
  finish: paint_black

parts:
  - id: chassis.front.damper
    name: Front hydraulic damper (lever arm)
    haynes: { section: 9, figures: [{ figure: "11.2", legend: 8 }, { figure: "11.1", legend: 1 }] }
    quantity: 2
    notes: >
      Armstrong lever-arm unit; its double arm is the upper wishbone (Sec 1). Cast body on a flanged base with four
      bolt lugs on the crossmember tower, two piston bores across it with hexagon end caps, the lid with its six
      screws and the filler plug on top (Fig 11.1 item 2; top up to the bottom of the plug hole, Sec 2 para 4), the
      shaft boss at the outboard end; the A-shaped arm pair on the shaft with the centre bolt between them (Sec 14
      para 1) and the eyes that clamp the fulcrum pin. Body height and bore sizes from Fig 11.2 proportions. Keep
      upright off the car (Sec 9 para 1). MGOC lists exchange units for both sides; the model mirrors one unit.
    specs:
      arm_centres: { in: 8.0, mm: 203.2, source: { label: H, page: 202, note: "Shock absorber arm centres, front" }, display_only: true }
      bolt_torque: { lbf_ft: [43, 45], nm: [58, 61], source: { label: H, page: 203, note: "Front shock absorber bolts" } }

  - id: chassis.front.damper-bolt
    name: Damper bolt
    haynes: { section: 9, figures: [{ figure: "11.2", legend: 9 }] }
    quantity: 8
    finish: zinc_steel
    notes: "Four per damper into the crossmember tower (Sec 9 para 1). 3/8 UNF (D)."
    specs:
      length: { in: 1.25, mm: 31.75, source: { label: D, method: "Damper base flange and the tower's tapped plate" } }

  - id: chassis.front.damper-washer
    name: Damper bolt spring washer
    haynes: { section: 9, figures: [{ figure: "11.2", legend: 10 }] }
    quantity: 8
    finish: zinc_steel
    specs: {}

  - id: chassis.front.damper-centre-bolt
    name: Damper arm centre bolt
    haynes: { section: 14 }
    quantity: 2
    finish: zinc_steel
    notes: "The bolt in the centre of the A-shaped arm: out first, then the arms are prised apart to free the swivel axle and pin (Sec 14 para 1). 5/16 UNF (D)."
    specs:
      length: { in: 3.75, mm: 95.25, source: { label: D, method: "Across both arms (72 mm between centre planes) plus washer and nut" } }

  - id: chassis.front.damper-centre-nut
    name: Damper arm centre bolt nut
    haynes: { section: 14 }
    quantity: 2
    finish: zinc_steel
    specs: {}

  - id: chassis.front.damper-centre-washer
    name: Damper arm centre bolt spring washer
    haynes: { section: 14 }
    quantity: 2
    finish: zinc_steel
    specs: {}

  - id: chassis.front.fulcrum-pin
    name: Fulcrum pin
    haynes: { section: 9, figures: [{ figure: "11.2", legend: 11 }] }
    quantity: 2
    finish: zinc_steel
    notes: "Through the damper arms' eyes and the trunnion's bearings; castellated nut, spring washer and split pin (Sec 9 para 1). 1/2 UNF (D)."
    specs:
      length: { in: 4.0, mm: 101.6, source: { label: D, method: "Across the arms (84 mm) plus washer, nut and split pin" } }

  - id: chassis.front.fulcrum-bearing
    name: Trunnion bearing (rubber)
    haynes: { section: 9, figures: [{ figure: "11.2", legend: 12 }] }
    quantity: 4
    finish: rubber
    notes: "Two top-hat rubber bearings in each trunnion eye, one from each side (MGOC: upper fulcrum bushes, top hat type)."
    specs:
      outside_diameter: { mm: 26.0, source: { label: D, method: "Trunnion eye bore" } }
      inside_diameter: { mm: 12.7, source: { label: D, method: "On the 1/2 in fulcrum pin" } }
      length: { mm: 28.5, source: { label: D, method: "Half the trunnion eye" } }

  - id: chassis.front.fulcrum-nut
    name: Fulcrum pin nut (castellated)
    haynes: { section: 9, figures: [{ figure: "11.2", legend: 13 }] }
    quantity: 2
    finish: zinc_steel
    specs: {}

  - id: chassis.front.fulcrum-washer
    name: Fulcrum pin spring washer
    haynes: { section: 9 }
    quantity: 2
    finish: zinc_steel
    specs: {}

  - id: chassis.front.split-pin
    name: Split pin
    haynes: { section: 9 }
    quantity: 8
    finish: zinc_steel
    notes: "Fulcrum pin nuts, swivel pin nuts and the wishbone pivot nuts (Secs 4, 9, 14)."
    specs:
      length: { mm: 25.0, source: { label: D, method: "Through the nut and pin" } }
      diameter: { mm: 3.2, source: { label: D, method: "1/8 in split pin" } }

  - id: chassis.front.trunnion
    name: Trunnion (top suspension link)
    haynes: { section: 14, figures: [{ figure: "11.2", legend: 59 }] }
    quantity: 2
    notes: >
      A boss on the swivel pin's threaded top, clamped by the castellated nut (60), with the cross eye for the fulcrum
      pin outboard of it and the two rubber bearings in the eye (Fig 11.2; MGOC top trunnion housing GSJ283). The
      floating thrust washers under it set the swivel axle's end play (Sec 14 para 4). Eye offset derived.
    specs:
      eye_offset: { mm: 24.0, source: { label: D, method: "Fulcrum eye outboard of the pin (layout TRUNNION_EYE_OUT)" } }

  - id: chassis.front.pin-nut
    name: Nut for swivel pin (castellated)
    haynes: { section: 14, figures: [{ figure: "11.2", legend: 60 }] }
    quantity: 2
    finish: zinc_steel
    specs:
      torque: { lbf_ft: 60, nm: 81, source: { label: H, page: 203, note: "Swivel pin nut; further if necessary to align the split pin hole" } }

  - id: chassis.front.pin-washer
    name: Swivel pin nut washer
    haynes: { section: 14, figures: [{ figure: "11.2", legend: 60 }] }
    quantity: 2
    finish: zinc_steel
    specs: {}

  - id: chassis.front.swivel-pin
    name: Swivel pin (king pin)
    haynes: { section: 14, figures: [{ figure: "11.2", legend: 46 }] }
    quantity: 2
    finish: machined_steel
    notes: >
      The pin with its base and the cross eye for the outer pivot bolt, bushed by the distance tube (Fig 11.2 items
      46, 47, 25); lubricator (61) under the eye, grub screw (48) in its side; threaded top for the trunnion.
      Inclined 8 deg (top inboard) and 7 deg castor (top rearward), static unloaded (H p202). Pin diameter derived.
    specs:
      king_pin_inclination: { deg: [7.25, 9.0], source: { label: H, page: 202, note: "8 deg positive +1 / -3/4 (static unloaded)" }, display_only: true }
      castor: { deg: [5.0, 7.25], source: { label: H, page: 202, note: "7 deg positive +1/4 / -2 (static unloaded)" }, display_only: true }
      diameter: { mm: 20.0, source: { label: D, method: "Bearing diameter in the swivel axle bushes" } }

  - id: chassis.front.grub-screw
    name: Grub screw
    haynes: { section: 14, figures: [{ figure: "11.2", legend: 48 }] }
    quantity: 2
    finish: zinc_steel
    specs:
      length: { mm: 8.0, source: { label: D, method: "Fig 11.2 proportions" } }

  - id: chassis.front.lubricator
    name: Lubricator nipple
    haynes: { section: 2, figures: [{ figure: "11.2", legend: 52 }, { figure: "11.2", legend: 61 }] }
    quantity: 6
    finish: zinc_steel
    notes: "Two on each swivel axle (52) and one under each swivel pin eye (61): six nipples (Sec 2 para 1; early models four, the extra lower swivel axle nipple from Sec 15). MGOC UHN400."
    specs: {}

  - id: chassis.front.cork-ring
    name: Cork ring
    haynes: { section: 14, figures: [{ figure: "11.2", legend: 53 }] }
    quantity: 2
    finish: cork
    notes: "On the swivel pin base under the lower dust excluder (Sec 14 para 4: do not forget it)."
    specs:
      outside_diameter: { mm: 32.0, source: { label: D, method: "Under the lower dust tube" } }
      thickness: { mm: 3.0, source: { label: D, method: "Fig 11.2 proportions" } }

  - id: chassis.front.dust-tube-lower
    name: Lower dust excluder tube
    haynes: { section: 14, figures: [{ figure: "11.2", legend: 54 }] }
    quantity: 2
    finish: zinc_steel
    part_numbers:
      - { number: 21B251, by: "MGOC Spares (dust tube, lower, king pin to stub axle)", source: { label: S, ref: "https://www.mgocspares.co.uk/acatalog/MGOC_SPARES_STUB_AXLES__MGB__40.html" } }
    specs:
      outside_diameter: { mm: 30.0, source: { label: D, method: "Inside the upper tube" } }
      length: { mm: 33.0, source: { label: D, method: "Pin base to the upper tube" } }

  - id: chassis.front.dust-tube-upper
    name: Upper dust excluder tube
    haynes: { section: 14, figures: [{ figure: "11.2", legend: 56 }] }
    quantity: 2
    finish: zinc_steel
    part_numbers:
      - { number: 1G4271, by: "MGOC Spares (dust tube, upper, king pin to stub axle)", source: { label: S, ref: "https://www.mgocspares.co.uk/acatalog/MGOC_SPARES_STUB_AXLES__MGB__40.html" } }
    specs:
      outside_diameter: { mm: 34.0, source: { label: D, method: "Over the lower tube" } }
      length: { mm: 22.0, source: { label: D, method: "Under the swivel axle boss" } }

  - id: chassis.front.dust-spring
    name: Dust excluder spring
    haynes: { section: 14, figures: [{ figure: "11.2", legend: 55 }] }
    quantity: 2
    finish: spring_steel
    part_numbers:
      - { number: 2K8951, by: "MGOC Spares (spring, king pin dust excluder tube)", source: { label: S, ref: "https://www.mgocspares.co.uk/acatalog/MGOC_SPARES_STUB_AXLES__MGB__40.html" } }
    specs:
      wire: { mm: 1.6, source: { label: D, method: "Light coil spring" } }
      outside_diameter: { mm: 27.0, source: { label: D, method: "Inside the tubes" } }
      length: { mm: 40.0, source: { label: D, method: "Between the tubes' ends" } }

  - id: chassis.front.swivel-bush-upper
    name: Swivel axle upper bush
    haynes: { section: 14, figures: [{ figure: "11.2", legend: 50 }] }
    quantity: 2
    finish: bronze
    part_numbers:
      - { number: ATC4246, by: "MGOC Spares (bush, king pin top)", source: { label: S, ref: "https://www.mgocspares.co.uk/acatalog/MGOC_SPARES_STUB_AXLES__MGB__40.html" } }
    notes: "Renewed and line reamed by a dealer if the axle rocks on the pin (Sec 14 para 2)."
    specs:
      outside_diameter: { mm: 25.4, source: { label: D, method: "Swivel axle boss bore" } }
      inside_diameter: { mm: 20.0, source: { label: D, method: "On the pin" } }
      length: { mm: 30.0, source: { label: D, method: "Fig 11.2 proportions" } }

  - id: chassis.front.swivel-bush-lower
    name: Swivel axle lower bush
    haynes: { section: 14, figures: [{ figure: "11.2", legend: 51 }] }
    quantity: 2
    finish: bronze
    part_numbers:
      - { number: BTB766, by: "MGOC Spares (bush, king pin bottom)", source: { label: S, ref: "https://www.mgocspares.co.uk/acatalog/MGOC_SPARES_STUB_AXLES__MGB__40.html" } }
    specs:
      outside_diameter: { mm: 25.4, source: { label: D, method: "Swivel axle boss bore" } }
      inside_diameter: { mm: 20.0, source: { label: D, method: "On the pin" } }
      length: { mm: 30.0, source: { label: D, method: "Fig 11.2 proportions" } }

  - id: chassis.front.thrust-washer
    name: Thrust washer (steel)
    haynes: { section: 14, figures: [{ figure: "11.2", legend: 57 }] }
    quantity: 2
    finish: machined_steel
    part_numbers:
      - { number: ATC4264, by: "MGOC Spares (thrust washer, king pin)", source: { label: S, ref: "https://www.mgocspares.co.uk/acatalog/MGOC_SPARES_STUB_AXLES__MGB__40.html" } }
    specs:
      outside_diameter: { mm: 34.0, source: { label: D, method: "On the swivel axle top" } }
      thickness: { mm: 1.6, source: { label: D, method: "Fig 11.2 proportions" } }

  - id: chassis.front.floating-thrust-washer
    name: Floating thrust washer (bronze)
    haynes: { section: 14, figures: [{ figure: "11.2", legend: 58 }] }
    quantity: 2
    finish: bronze
    notes: "Selected to give no more than 0.002 in end play; available 0.052-0.057, 0.058-0.063 and 0.064-0.069 in (Sec 14 para 4). The thinnest size is drawn."
    specs:
      thickness: { in: [0.052, 0.057], mm: [1.32, 1.44], source: { label: H, page: 210, note: "Floating thrust washer 0.052 to 0.057 in (Fig 11.2 legend, p205; Sec 14 para 4)" } }
      outside_diameter: { mm: 34.0, source: { label: D, method: "As the steel washer" } }

  - id: chassis.front.swivel-axle-lh
    name: Swivel axle, left-hand (near side)
    haynes: { section: 14, figures: [{ figure: "11.2", legend: 49 }] }
    quantity: 1
    finish: machined_steel
    part_numbers:
      - { number: BTB765, by: "MGOC Spares (stub axle assembly with trunnion, LH)", source: { label: S, ref: "https://www.mgocspares.co.uk/acatalog/MGOC_SPARES_STUB_AXLES__MGB__40.html" } }
    notes: >
      One forging (Fig 11.2): the bushed boss on the swivel pin with two lubricator bosses (the lower one is the Sec
      15 extra nipple, on the LH axle facing forward), the stub axle with the taper bearing seats, spacer journal,
      washer key slot and the 3/4 in UNF thread with its split pin hole, the flange face with three tapped pads
      for the dust cover screws, the caliper flange behind the axle with its two bolt holes (P8 datums
      CALIPER_MOUNT_FACE_Y, SWIVEL_CALIPER_FLANGE_T, LUG_U/LUG_V) and the lug the steering lever bolts under. The
      stub axle is drawn level: the published 1 deg positive camber is not applied so the hub, disc and caliper
      keep P8's frame (PLAN questions).
    specs:
      camber: { deg: [0.75, 1.5], source: { label: H, page: 202, note: "1 deg positive +1/2 / -1/4 (static unloaded); not drawn" }, display_only: true }
      end_play: { in: 0.002, mm: 0.05, source: { label: H, page: 210, note: "Maximum vertical play of the swivel axle on the pin (Sec 14 para 4)" }, display_only: true }

  - id: chassis.front.swivel-axle-rh
    name: Swivel axle, right-hand (off side)
    haynes: { section: 14, figures: [{ figure: "11.2", legend: 49 }] }
    quantity: 1
    finish: machined_steel
    part_numbers:
      - { number: BTB764, by: "MGOC Spares (stub axle assembly with trunnion, RH)", source: { label: S, ref: "https://www.mgocspares.co.uk/acatalog/MGOC_SPARES_STUB_AXLES__MGB__40.html" } }
    notes: "Mirror of the left-hand axle; its extra lower nipple faces rearward (Sec 15 para 2)."
    specs:
      camber: { deg: [0.75, 1.5], source: { label: H, page: 202, note: "1 deg positive +1/2 / -1/4 (static unloaded); not drawn" }, display_only: true }

  - id: chassis.front.wishbone-arm
    name: Wishbone arm
    haynes: { section: 4, figures: [{ figure: "11.2", legend: 20 }, { figure: "11.1" }] }
    quantity: 4
    notes: >
      Pressed channel arm, a front and a rear one each side (Fig 11.1): the web with the flanges turned away from the
      pan, the bush housing at the inner end, the pivot bolt hole at the outer, two holes for the pan screws and
      lightening holes. Check the holes for ovality (Sec 4 para 2). Section derived from the figures.
    specs:
      depth: { mm: 38.0, source: { label: D, method: "Fig 11.1 proportions" } }

  - id: chassis.front.wishbone-pivot
    name: Wishbone pivot
    haynes: { section: 4, figures: [{ figure: "11.2", legend: 33 }] }
    quantity: 2
    finish: machined_steel
    notes: "Bar along the car bolted up under the crossmember by two bolts (34-36), the arms' inner ends on its bushes; fully tighten before the spring goes in (Sec 4 para 3). 5/8 in UNF ends (D)."
    specs: {}

  - id: chassis.front.pivot-bolt-34
    name: Wishbone pivot retaining bolt
    haynes: { section: 4, figures: [{ figure: "11.2", legend: 34 }] }
    quantity: 4
    finish: zinc_steel
    specs:
      length: { in: 2.0, mm: 50.8, source: { label: D, method: "Pivot pad, crossmember underside and the nut inside" } }

  - id: chassis.front.pivot-nut-35
    name: Wishbone pivot retaining nut
    haynes: { section: 4, figures: [{ figure: "11.2", legend: 35 }] }
    quantity: 4
    finish: zinc_steel
    specs: {}

  - id: chassis.front.pivot-washer-36
    name: Wishbone pivot retaining spring washer
    haynes: { section: 4, figures: [{ figure: "11.2", legend: 36 }] }
    quantity: 4
    finish: zinc_steel
    specs: {}

  - id: chassis.front.pivot-bush
    name: Wishbone pivot bush
    haynes: { section: 4, figures: [{ figure: "11.2", legend: 37 }] }
    quantity: 4
    finish: rubber
    specs:
      outside_diameter: { mm: 32.0, source: { label: D, method: "Arm bush housing bore" } }
      inside_diameter: { mm: 22.0, source: { label: D, method: "On the pivot journal" } }
      length: { mm: 26.0, source: { label: D, method: "Bush housing length less the flange" } }

  - id: chassis.front.pivot-washer
    name: Wishbone pivot washer
    haynes: { section: 4, figures: [{ figure: "11.2", legend: 38 }] }
    quantity: 4
    finish: zinc_steel
    specs:
      thickness: { mm: 2.5, source: { label: D, method: "Fig 11.2 proportions" } }

  - id: chassis.front.pivot-nut
    name: Wishbone pivot nut (castellated)
    haynes: { section: 4, figures: [{ figure: "11.2", legend: 39 }] }
    quantity: 4
    finish: zinc_steel
    specs: {}

  - id: chassis.front.outer-pivot-bolt
    name: Pivot bolt, wishbone to swivel pin
    haynes: { section: 14, figures: [{ figure: "11.2", legend: 30 }] }
    quantity: 2
    finish: zinc_steel
    specs:
      length: { in: 4.25, mm: 107.95, source: { label: D, method: "Across both arms at the swivel pin eye plus washer and nut" } }

  - id: chassis.front.outer-pivot-nut
    name: Pivot bolt nut
    haynes: { section: 14, figures: [{ figure: "11.2", legend: 31 }] }
    quantity: 2
    finish: zinc_steel
    specs: {}

  - id: chassis.front.outer-pivot-washer
    name: Pivot bolt spring washer
    haynes: { section: 14, figures: [{ figure: "11.2", legend: 32 }] }
    quantity: 2
    finish: zinc_steel
    specs: {}

  - id: chassis.front.distance-tube
    name: Distance tube
    haynes: { section: 4, figures: [{ figure: "11.2", legend: 25 }] }
    quantity: 2
    finish: machined_steel
    notes: "A close sliding fit in the swivel pin's eye bush; with the thrust washers, seals and supports it gives 0.008-0.013 in end float (Sec 4 para 3)."
    specs:
      length: { mm: 80.5, source: { label: D, method: "Between the arms' inner faces at the eye" } }
      end_float: { in: [0.008, 0.013], mm: [0.20, 0.32], source: { label: H, page: 204, note: "Sec 4 para 3" }, display_only: true }

  - id: chassis.front.eye-thrust-washer
    name: Thrust washer (swivel pin eye)
    haynes: { section: 4, figures: [{ figure: "11.2", legend: 26 }] }
    quantity: 4
    finish: machined_steel
    specs:
      thickness: { mm: 1.6, source: { label: D, method: "Fig 11.2 proportions" } }

  - id: chassis.front.eye-seal
    name: Seal (swivel pin eye)
    haynes: { section: 4, figures: [{ figure: "11.2", legend: 27 }] }
    quantity: 4
    finish: rubber
    part_numbers:
      - { number: AAA1323, by: "MGOC Spares (dust seal, rubber, king pin lower trunnion)", source: { label: S, ref: "https://www.mgocspares.co.uk/acatalog/MGOC_SPARES_STUB_AXLES__MGB__40.html" } }
    specs:
      outside_diameter: { mm: 36.0, source: { label: D, method: "Fig 11.2 proportions" } }

  - id: chassis.front.seal-support
    name: Seal support
    haynes: { section: 4, figures: [{ figure: "11.2", legend: 28 }] }
    quantity: 4
    finish: zinc_steel
    specs:
      outside_diameter: { mm: 38.0, source: { label: D, method: "Over the seal" } }

  - id: chassis.front.pan
    name: Spring pan assembly
    haynes: { section: 5, figures: [{ figure: "11.2", legend: 19 }] }
    quantity: 2
    notes: "Pressed tray between the arms; the spring seat dished in its middle; four screws, nuts and spring washers to the arms (Sec 5 para 2); jack under it with a block of wood (Sec 5)."
    specs:
      screw_torque: { lbf_ft: 22, nm: 30, source: { label: H, page: 203, note: "Spring pan nuts and screws" } }

  - id: chassis.front.pan-screw
    name: Screw, wishbone to pan
    haynes: { section: 5, figures: [{ figure: "11.2", legend: 21 }, { figure: "11.2", legend: 22 }] }
    quantity: 8
    finish: zinc_steel
    specs:
      length: { in: 0.75, mm: 19.05, source: { label: D, method: "Arm web, pan flange and nut" } }

  - id: chassis.front.pan-nut
    name: Spring pan nut
    haynes: { section: 5, figures: [{ figure: "11.2", legend: 23 }] }
    quantity: 8
    finish: zinc_steel
    specs: {}

  - id: chassis.front.pan-washer
    name: Spring pan washer
    haynes: { section: 5, figures: [{ figure: "11.2", legend: 24 }] }
    quantity: 8
    finish: zinc_steel
    specs: {}

  - id: chassis.front.coil-spring
    name: Front coil spring
    haynes: { section: 5, figures: [{ figure: "11.2", legend: 14 }] }
    quantity: 2
    finish: spring_steel
    part_numbers:
      - { number: AHH6451, by: "British Parts Northwest (front coil spring, MGB roadster 63-72, 350 lb/in, 9.9 in free)", source: { label: S, ref: "https://bpnorthwest.com/mg/coil-spring-front-mgb-63-to-72/" } }
    notes: >
      Closed and ground ends; drawn free on its own and at the static laden length between the pan and the
      crossmember spigot in the assembly (D, layout SPRING_INSTALLED). Measure against the specification and
      renew both if they differ (Sec 5 para 3). Rate 350 lb/in (61.3 N/mm, British Parts Northwest); wire and coil size derived from it.
    specs:
      free_height: { in: 9.9, mm: 251.46, source: { label: H, page: 202, note: "Early models (18G and 18GA)" } }
      wire_diameter: { in: 0.5, mm: 12.7, source: { label: D, method: "Rate 350 lb/in with 6.5 active coils of 3.3 in mean diameter" } }
      outside_diameter: { mm: 96.5, source: { label: D, method: "Mean diameter 3.3 in plus the wire" } }
