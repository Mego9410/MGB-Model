- id: electrical.wiring-wipers-horn.green-joint-to-wiper-motor
  name: 'G: green joint (fused supply, behind the facia) to wiper motor 2'
  haynes:
    figures:
    - figure: '10.26'
      legend: '37'
  quantity: 1
  finish: wire_G
  notes: 'Green fused supply to the wiper motor (Fig 10.26: 37 terminal 2). Colour G (green), 14/0.30. Colour and both ends: Haynes Fig 10.26
    (wiring diagram up to 1967), printed p190; route derived (mgb/wiring_layout.py).'
  wire:
    code: G
    size: 14/0.30
    circuit: Windscreen wipers
    fuse: A3-A4 (35 A)
    from:
      part: electrical.wiring-starting.g-joint-facia
      terminal: ''
      label: Green joint (fused supply, behind the facia)
    to:
      part: electrical.wipers.motor
      terminal: '2'
      label: Wiper motor (DR3A)
    via:
    - Facia harness
  route:
    from: joint.g-joint-facia
    to: wiper.2
  specs:
    diameter:
      mm: 2.6
      display_only: true
      source:
        label: S
        ref: 'Auto Electric Supplies, standard cable: nominal outside diameter, 14/0.30'
