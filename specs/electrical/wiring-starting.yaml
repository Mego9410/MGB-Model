      label: Green joint (fuse A4 supply, engine bay)
    to:
      part: electrical.wiring-starting.g-joint-facia
      terminal: ''
      label: Green joint (fused supply, behind the facia)
    via:
    - Main harness, engine bay
    - Bulkhead grommet
    - Facia harness
    via_parts:
    - electrical.loom.bulkhead-grommet
  route:
    from: joint.g-joint-bay
    to: joint.g-joint-facia
  specs:
    diameter:
      mm: 2.6
      display_only: true
      source:
        label: S
        ref: 'Auto Electric Supplies, standard cable: nominal outside diameter, 14/0.30'
- id: electrical.wiring-starting.fuse-a3-to-fuel-pump
  name: 'W: fuse block A3 to fuel pump'
  haynes:
    figures:
    - figure: '10.26'
      legend: 19, 41
  quantity: 1
  finish: wire_W
  notes: 'White from A3 back through the rear harness to the SU pump''s terminal (Fig 10.26: W to 41). Colour W (white), 14/0.30. Colour and both
    ends: Haynes Fig 10.26 (wiring diagram up to 1967), printed p190; route derived (mgb/wiring_layout.py).'
  wire:
    code: W
    size: 14/0.30
    circuit: Fuel pump
    fuse: 'Unfused: white, ignition supply (A3 is the fuse''s input)'
    from:
      part: electrical.control.fuse-block
      terminal: A3
      label: Fuse block (4FJ)
    to:
      part: fuel.pump.end-cover
      terminal: terminal stud
      label: Fuel pump (SU)
    via:
    - Main harness, engine bay
    - Bulkhead grommet
    - Facia harness
    - Rear harness
    via_parts:
    - electrical.loom.bulkhead-grommet
  route:
    from: fuse.A3
    to: pump.feed
  specs:
