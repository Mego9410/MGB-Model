- id: electrical.wiring-indicators.indicator-switch
  name: Direction indicator switch
  haynes:
    section: 45
    figures:
    - figure: '10.26'
      legend: '26'
  quantity: 1
  finish: plastic_black
  notes: 'Lucas column-mounted direction indicator switch (Fig 10.26 item 26): the moulded body clamped to the steering column under the wheel,
    its lever, the cancelling cam and the row of Lucar blades for the flasher lead (LGN), the two flasher circuits (GR left, GW right), the two
    warning lamp returns (LGY, LGW) and their earth (B), and the horn push lead (PB) on to the column. The column, wheel and horn push are P9''s;
    position derived (body_layout COLUMN_SWITCH).'
  specs:
    body_width:
      mm: 64.0
      source:
        label: D
        method: Scaled from photographs of the early Lucas column switch
