# Wiring loom coverings (P10b): the braided sleeving over the main runs of the harness and the bulkhead grommet.
# The wires themselves are the electrical.wiring-* assemblies. Haynes Fig 10.26 (printed p190). PDF page = printed + 4.
defaults:
  system: electrical
  assembly: electrical.loom
  haynes: { section: 1, figures: [{ figure: "10.26" }] }
  variant: { factory_1963: true, as_fitted: true }
  finish: loom

parts:
  - id: electrical.loom.engine-bay
    name: Main harness sleeving, engine bay
    quantity: 1
    notes: >
      Braided sleeving over the main harness from the bulkhead grommet forward along the top of the right inner wing,
      across behind the grille and back along the left wing to the overdrive relay and throttle switch (early MGB
      harnesses are covered in lacquered cotton braid; the branches to the units leave it as bare wires). It fits the
      bundle it covers: its size on each run is the bundle's (mgb/wiring_layout.py). Hide it with the eye toggle to see
      the wires inside. Route derived.
    specs:
      wall: { mm: 0.5, source: { label: D, method: "Thin braided cotton sleeving" } }

  - id: electrical.loom.facia
    name: Facia harness sleeving
    quantity: 1
    notes: "Braided sleeving over the harness from the grommet behind the facia, along behind the instruments and switches to the wiper motor, and down to the dip switch and the column switch. Route derived."
    specs:
      wall: { mm: 0.5, source: { label: D, method: "Thin braided cotton sleeving" } }

  - id: electrical.loom.rear
    name: Rear harness sleeving
    quantity: 1
    notes: "Braided sleeving over the rear harness down the right-hand sill, up the heelboard, over the right-hand wheel arch into the boot and across the rear panel. Route derived."
    specs:
      wall: { mm: 0.5, source: { label: D, method: "Thin braided cotton sleeving" } }

  - id: electrical.loom.overdrive
    name: Overdrive leads sleeving
    quantity: 1
    notes: "Sleeving over the overdrive leads from the relay down past the bulkhead into the tunnel to the gearbox switch and on to the solenoid (Ch 6 Sec 16). Route derived."
    specs:
      wall: { mm: 0.5, source: { label: D, method: "Thin braided cotton sleeving" } }

  - id: electrical.loom.bulkhead-grommet
    name: Main harness bulkhead grommet
    quantity: 1
    finish: rubber
    notes: "Rubber grommet in the bulkhead where the main harness passes from the engine bay to behind the facia (right-hand side, high). Position derived (mgb/body_layout.py HARNESS_GROMMET); its hole in the bulkhead is the body's (P11)."
    specs:
      flange_diameter: { mm: 40.0, source: { label: D, method: "Sized round the harness bundle with a 6 mm lip" } }
