# Exterior lamps. Haynes Ch 10 Sec 34-37, Fig 10.7 and Fig 10.8 (printed p172-173), photos 35.1,
# 36.1 and 37.1 (printed p173-174); Fig 10.26 (early wiring) items 8-12, 15-17, 28-31.
# Positions: mgb/body_layout.py (P11 builds the wings, nacelles, rear panel and overriders round
# them). Reversing lamps (Sec 38) were not fitted to 1963 cars and are not modelled.
# PDF page = printed page + 4.
defaults:
  system: electrical
  assembly: electrical.lamps
  haynes: { section: 34 }
  variant: { factory_1963: true, as_fitted: true }
  finish: chrome

parts:
  - id: electrical.lamps.headlamp-bowl
    name: Headlamp body (bowl)
    haynes: { figures: [{ figure: "10.7" }] }
    quantity: 2
    finish: paint_black
    notes: >
      Pressed lamp body in the wing nacelle, with the three beam setting screws (Fig 10.7 item
      4: vertical at the top, horizontal at the sides, Sec 34 para 6) and the grommet for the
      leads at the back. Depth derived from the nacelle; Fig 10.7 shows the four retaining
      systems used over the years, the early one being the combined adjusting and retaining
      screws (item 2), modelled here.
    specs:
      depth: { mm: 118.0, source: { label: D, method: "7 in pre-focus/sealed beam bowl, Fig 10.7 proportion" } }

  - id: electrical.lamps.light-unit
    name: Headlamp light unit, 7 in
    haynes: { figures: [{ figure: "10.8", legend: 4 }] }
    quantity: 2
    finish: lens_headlamp
    notes: >
      Sealed beam or bulb-type light unit (Sec 34 para 1); the lugs on a sealed beam allow one position only (para 10).
      QA fix round 1 (front finding 18): the clear glass only - a domed Lucas lens moulded with bands of fine vertical
      flutes divided by three horizontal steps - so the reflector and bulb show through it as on Oliver's car (keyframes
      kf210, kf212, kf028); before, a flat grey disc. The reflector, bulb and seating rim are electrical.lamps.reflector.
    specs:
      diameter: { in: 7.0, mm: 177.8, source: { label: D, method: "Standard 7 in British headlamp unit (Lucas F700 class)" } }
      flute_pitch: { mm: 5.2, source: { label: D, method: "Oliver's keyframes kf210, kf212: about 34 flutes across the lens's middle band" } }

  - id: electrical.lamps.reflector
    name: Headlamp reflector, bulb and seating rim
    haynes: { figures: [{ figure: "10.8", legend: 4 }] }
    quantity: 2
    finish: chrome
    notes: >
      QA fix round 1: split from the light unit so the lens can be glass. The silvered parabolic reflector, the bulb with
      its shield cap (seen through the lens in kf210, kf212), the bulb holder or plug at the back and the seating rim with
      the three slotted lugs over the beam setting screws (Fig 10.8 items 2 and 4).
    specs:
      depth: { mm: 66.0, source: { label: D, method: "Fig 10.8 proportion, inside the 118 mm bowl" } }

  - id: electrical.lamps.headlamp-rim
    name: Headlamp chrome rim
    haynes: { section: 34 }
    quantity: 2
    notes: "Hooked on the lugs at the top and snapped down, with the cut-out at the bottom (Sec 34 paras 1 and 5). Profile derived. QA fix round 1 (front finding 19, the rim's part): the fixing screw at the bottom beside the cut-out (Oliver's keyframes kf210, kf212)."
    specs:
      outside_diameter: { mm: 197.8, source: { label: D, method: "7 in unit plus the rim's lip" } }

  - id: electrical.lamps.dust-excluder
    name: Headlamp dust excluder
    haynes: { section: 34 }
    quantity: 2
    finish: rubber
    specs:
      thickness: { mm: 2.0, source: { label: D, method: "Rubber ring" } }

  - id: electrical.lamps.adjusting-screw
    name: Headlamp beam setting screw and spring
    haynes: { figures: [{ figure: "10.7", legend: 4 }] }
    quantity: 6
    finish: zinc_steel
    specs:
      length: { mm: 22.0, source: { label: D, method: "Fig 10.7 proportion" } }

  - id: electrical.lamps.side-body
    name: Side and flasher lamp body
    haynes: { section: 35 }
    quantity: 2
    notes: "Wing-mounted type: the body held by two nuts behind the wing (Sec 35 para 2); photo 35.1. Rectangular on Oliver's car (photos 10, 20; P11b changed it from P10's lozenge): amber flasher inboard, clear side lamp outboard, chrome surround. QA fix round 1 (front finding 20): centred |y| 555, h 465 on the wing (scan) and turned 30 deg outboard with the wing corner (kf210-213; body_layout SIDELAMP_*); the wing there turns about 19 deg, so the chrome body's back is deep enough to meet it."
    specs:
      width: { mm: 140.0, source: { label: D, method: "QA fix round 1: Oliver's scan front elevation, the lamp y 490-623 (133 seen from ahead) with its face turned 30 deg" } }
      height: { mm: 56.0, source: { label: D, method: "QA fix round 1: Oliver's scan front elevation, h 436-495 over the bezel" } }

  - id: electrical.lamps.side-lens-clear
    name: Side lamp lens (clear)
    haynes: { section: 35 }
    quantity: 2
    finish: lens_clear
    notes: "Outboard third of the lens, over the side (parking) lamp (Fig 10.26 items 11, 12; Oliver's photo 10). QA fix round 1: moulded with fine horizontal ribs (kf210, kf212)."
    specs:
      width: { mm: 140.0, source: { label: D, method: "QA fix round 1: Oliver's scan front elevation, the lamp y 490-623 (133 seen from ahead) with its face turned 30 deg" } }
      height: { mm: 56.0, source: { label: D, method: "QA fix round 1: Oliver's scan front elevation, h 436-495 over the bezel" } }

  - id: electrical.lamps.side-lens-amber
    name: Front flasher lens (amber)
    haynes: { section: 35 }
    quantity: 2
    finish: lens_amber
    notes: "Inboard two thirds of the lens, over the front flasher (Fig 10.26 items 28, 29; Oliver's photo 10). QA fix round 1: a faceted hip-roofed prism, its ridge along the middle and the inboard end drawn to a point (kf210-213); before, flat with a stepped edge."
    specs:
      width: { mm: 140.0, source: { label: D, method: "QA fix round 1: Oliver's scan front elevation, the lamp y 490-623 (133 seen from ahead) with its face turned 30 deg" } }
      height: { mm: 56.0, source: { label: D, method: "QA fix round 1: Oliver's scan front elevation, h 436-495 over the bezel" } }

  - id: electrical.lamps.side-rim
    name: Side lamp lens rim
    haynes: { section: 35 }
    quantity: 2
    notes: "Lens and sealing rubber held by the screws (Sec 35 para 1). QA fix round 1: a chrome bezel with a sloping face, the dividing bar and the two end screws (kf210-213)."
    specs:
      width: { mm: 140.0, source: { label: D, method: "QA fix round 1: Oliver's scan front elevation, the lamp y 490-623 (133 seen from ahead) with its face turned 30 deg" } }
      height: { mm: 56.0, source: { label: D, method: "QA fix round 1: Oliver's scan front elevation, h 436-495 over the bezel" } }

  - id: electrical.lamps.rear-body
    name: Rear lamp body and plinth
    haynes: { section: 36 }
    quantity: 2
    notes: "Earlier version (Sec 36 paras 1-3): the stop/tail and flasher bulbs one above the other (photo 36.1), body held by three screws, the lens hooked over the upper lip and held by one screw at the bottom. QA fix round 1 (Oliver's photo 25, kf058, kf176, kf178): no bar across the lens; a gothic-arch top on parallel sides; the rim ends at the bottom in a chrome foot that cups the lens's reflex block and carries the lens screw. Centre 713 above the road (body_layout REAR_LAMP_Z): the chrome 595-836 on the car."
    specs:
      height: { mm: 304.0, source: { label: D, method: "Oliver's photos 14, 18, 25 (scaled on the 520 mm plate): 250 mm tall seen from behind on the 33 deg plinth (292 mm on the rake), 97 mm wide over the 6 mm chrome rim, a gothic arch over the top 37 %" } }

  - id: electrical.lamps.rear-lens-red
    name: Stop and tail lens (red)
    haynes: { section: 36 }
    quantity: 2
    finish: lens_red
    notes: "Double filament bulb: tail, and the brighter stop light (Sec 36 para 1). One moulding with the integral rectangular reflex block across the bottom 22 % (QA fix round 1; Oliver's photo 25, kf176, kf178): the block stands 2 mm proud of the lens at its foot and 20 at its top (its face nearer upright than the plinth), with a prism grid on its face; the separate round reflectors under the lamps are gone."
    specs:
      height: { mm: 184.0, source: { label: D, method: "Oliver's photo 25, kf176, kf178: the lower 63 % of the lamp, the reflex block the bottom 22 %" } }
      reflex_proud: { mm: 20.0, source: { label: D, method: "kf178: the block's ledge at its top against the 84 mm lens width" } }

  - id: electrical.lamps.rear-lens-amber
    name: Rear flasher lens (amber)
    haynes: { section: 36 }
    quantity: 2
    finish: lens_amber
    specs:
      height: { mm: 108.0, source: { label: D, method: "Oliver's photo 25, kf176, kf178: the top 37 % of the lens, the gothic arch" } }

  - id: electrical.lamps.plate-lamp
    name: Number plate lamp (plinth and cover)
    haynes: { section: 37 }
    quantity: 2
    notes: "Basic type: two lamps, one on each inside face of the rear overriders, cover, lens, washer and plinth held by two screws to nuts and distance pieces in the overrider (Sec 37 paras 1-2; photo 37.1). QA fix round 1: on Oliver's car the chrome 'ear' near the top of each overrider's inboard face, centred 551 above the road (body_layout NUMBER_LAMP), not at its foot: a chrome block on the overrider and a round-ended barrel reaching 40 mm in toward the plate, the lens under the barrel (Oliver's photo 25 zoomed, kf165, kf168, kf171, kf173)."
    specs:
      width: { mm: 58.0, source: { label: D, method: "Oliver's photo 25 zoomed: the lamp reaches about 40 mm in from the overrider's face (58 with its 18 mm base)" } }
      height: { mm: 34.0, source: { label: D, method: "Oliver's photo 25 zoomed (about 34 mm tall)" } }

  - id: electrical.lamps.plate-lens
    name: Number plate lamp lens
    haynes: { section: 37 }
    quantity: 2
    finish: lens_clear
    specs:
      width: { mm: 58.0, source: { label: D, method: "As the lamp (Oliver's photo 25 zoomed)" } }
      height: { mm: 34.0, source: { label: D, method: "As the lamp (Oliver's photo 25 zoomed)" } }
